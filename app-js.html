<script>
  window.ModuleLoaders = window.ModuleLoaders || {};
  const App = (() => {
    const state = { token: '', user: null, acl: [], config: {}, enums: {}, lookups: null, notifications: [], currentModule: 'tarefas' };
    const tokenKey = 'cozinhaflow_token';
    const defaultPushVapidPublicKey = 'BGqSNGYZ-HddJ0w8yovAl1GynknDxTmHIHo-Hw1nl4G5R7Zt0tGMXDxskOOauRqXxGgbBtmPJdZxVPU1mRlxG5o';
    const pushVapidPublicKey = () => String(state.config?.PUSH_VAPID_PUBLIC_KEY || defaultPushVapidPublicKey).trim();
    const defaultRewardCatalog = [
      { id: 'refri_lata', name: 'Refrigerante ou suco', description: 'Uma bebida individual gelada.', cost: 100, emoji: '🥤', tone: 'ice' },
      { id: 'sobremesa', name: 'Sobremesa da casa', description: 'Um doce individual do dia.', cost: 120, emoji: '🍨', tone: 'berry' },
      { id: 'batata_individual', name: 'Batata individual', description: 'Uma porção para aproveitar no intervalo.', cost: 150, emoji: '🍟', tone: 'gold' },
      { id: 'pizza_brotinho', name: 'Pizza brotinho', description: 'Um sabor disponível escolhido pelo funcionário.', cost: 180, emoji: '🍕', tone: 'pizza' },
      { id: 'descanso_30', name: '+30 min de descanso', description: 'Pausa extra combinada com a liderança.', cost: 200, emoji: '☕', tone: 'mint' },
      { id: 'lanche_escolha', name: 'Lanche à escolha', description: 'Um hambúrguer individual do cardápio interno.', cost: 240, emoji: '🍔', tone: 'burger' },
      { id: 'descanso_60', name: '+1 hora de descanso', description: 'Uma hora extra de descanso agendada.', cost: 320, emoji: '⏰', tone: 'violet' },
      { id: 'combo_individual', name: 'Combo individual', description: 'Lanche, acompanhamento e bebida.', cost: 400, emoji: '🍔', tone: 'fire' },
      { id: 'escolher_turno', name: 'Escolher o turno', description: 'Prioridade na escolha de um turno disponível.', cost: 500, emoji: '📅', tone: 'blue' },
      { id: 'kit_house', name: 'Kit House exclusivo', description: 'Camisa ou boné da equipe, conforme disponibilidade.', cost: 600, emoji: '🧢', tone: 'ink' },
      { id: 'folga_extra', name: 'Folga extra', description: 'Uma folga agendada com antecedência e aprovação.', cost: 800, emoji: '🏖️', tone: 'legend', featured: true }
    ];
    let rewardCatalog = defaultRewardCatalog.slice();
    const kitchenLevels = [
      { min: 0, name: 'Ajudante da Cozinha', emoji: '🍳', short: 'Ajudante' },
      { min: 60, name: 'Mestre do Molho', emoji: '🍅', short: 'Molho' },
      { min: 150, name: 'Guardião da Fritadeira', emoji: '🍗', short: 'Fritadeira' },
      { min: 300, name: 'Rei da Chapa', emoji: '🍔', short: 'Chapa' },
      { min: 550, name: 'Pizzaiolo de Ouro', emoji: '🍕', short: 'Pizzaiolo' },
      { min: 900, name: 'Mestre do Crocante', emoji: '🔥', short: 'Crocante' },
      { min: 1500, name: 'Chef da House', emoji: '👨‍🍳', short: 'Chef' },
      { min: 2500, name: 'Lenda do Foodpark', emoji: '🏆', short: 'Lenda' }
    ];
    const getToken = () => sessionStorage.getItem(tokenKey) || localStorage.getItem(tokenKey) || '';
    const setToken = (token, remember) => {
      sessionStorage.removeItem(tokenKey); localStorage.removeItem(tokenKey);
      (remember ? localStorage : sessionStorage).setItem(tokenKey, token);
      state.token = token;
    };
    const clearToken = () => { sessionStorage.removeItem(tokenKey); localStorage.removeItem(tokenKey); state.token = ''; };
    const server = (action, payload = {}) => new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(response => {
          if (!response?.ok) {
            const error = new Error(response?.error || 'Não foi possível concluir a operação.');
            error.code = response?.code;
            if (error.code === 'UNAUTHENTICATED') signedOut();
            reject(error);
          } else resolve(response.data);
        })
        .withFailureHandler(error => reject(new Error(error.message || String(error))))
        .apiRequest(action, payload, state.token || getToken());
    });
    async function boot() {
      Login.bind();
      bindGlobalEvents();
      const bootstrap = await Login.publicCall('publicBootstrap');
      state.token = getToken();
      if (bootstrap.installed && state.token) {
        try { await start(); return; } catch (error) { clearToken(); }
      }
      Login.show(bootstrap.installed, bootstrap);
    }
    async function start() {
      state.token = state.token || getToken();
      const data = await server('session.me');
      state.user = data.user;
      state.acl = data.acl || [];
      state.config = data.config || {};
      state.enums = data.enums || {};
      state.notifications = data.notifications || [];
      state.lookups = await server('lookups.get');
      renderShell();
      document.getElementById('bootLoader').classList.add('d-none');
      document.getElementById('loginScreen').classList.add('d-none');
      document.getElementById('appShell').classList.remove('d-none');
      await navigate('tarefas');
      setTimeout(() => refreshPushRegistration().catch(() => {}), 700);
    }
    function renderShell() {
      const config = state.config;
      document.body.dataset.userRole = state.user.role;
      const configuredName = config.APP_NAME || '';
      document.getElementById('sidebarAppName').textContent = !configuredName || configuredName === 'CozinhaFlow ERP'
        ? 'CozinhaFlow Tarefas'
        : configuredName;
      document.getElementById('sidebarCompany').textContent = config.COMPANY_NAME || '';
      document.getElementById('userName').textContent = state.user.name;
      document.getElementById('userRole').textContent = state.user.role;
      document.getElementById('userAvatar').textContent = state.user.name.split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
      const all = state.acl.includes('*');
      document.querySelectorAll('[data-resource]').forEach(item => {
        const resource = item.dataset.resource;
        const allowed = all || resource === 'tarefas' || (resource === 'admin' ? state.user.role === 'Administrador' : state.acl.includes(resource));
        item.classList.toggle('d-none', !allowed);
      });
      document.querySelector('#profileForm [name=name]').value = state.user.name;
      document.querySelector('#profileForm [name=email]').value = state.user.email;
      renderNotifications();
    }
    async function navigate(module) {
      const target = document.getElementById(`view-${module}`);
      if (!target) return;
      state.currentModule = module;
      document.querySelectorAll('.page-view').forEach(view => view.classList.toggle('active', view === target));
      document.querySelectorAll('.side-link[data-module]').forEach(link => link.classList.toggle('active', link.dataset.module === module));
      document.querySelectorAll('.mobile-nav-link[data-module]').forEach(link => link.classList.toggle('active', link.dataset.module === module));
      if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('mobile-open');
        document.body.classList.remove('sidebar-open');
        document.getElementById('sidebarToggle').setAttribute('aria-expanded', 'false');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const loader = window.ModuleLoaders[module];
      if (loader) {
        try { await loader(); }
        catch (error) { UI.toast(error.message, 'danger'); }
      }
    }
    function bindGlobalEvents() {
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebarBackdrop = document.getElementById('sidebarBackdrop');
      const setMobileSidebar = open => {
        sidebar.classList.toggle('mobile-open', open);
        document.body.classList.toggle('sidebar-open', open);
        sidebarToggle.setAttribute('aria-expanded', String(open));
      };
      document.addEventListener('click', event => {
        if (event.target.closest('[data-mobile-menu]')) {
          setMobileSidebar(true);
          return;
        }
        const nav = event.target.closest('[data-module],[data-navigate]');
        if (nav) navigate(nav.dataset.module || nav.dataset.navigate);
        const rippleTarget = event.target.closest('.btn,.side-link,.icon-btn');
        if (rippleTarget) {
          const dot = document.createElement('span');
          const rect = rippleTarget.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          dot.className = 'ripple-dot';
          Object.assign(dot.style, { width: `${size}px`, height: `${size}px`, left: `${event.clientX - rect.left - size / 2}px`, top: `${event.clientY - rect.top - size / 2}px` });
          rippleTarget.appendChild(dot); setTimeout(() => dot.remove(), 600);
        }
      });
      sidebarToggle.onclick = () => {
        if (window.innerWidth <= 900) setMobileSidebar(!sidebar.classList.contains('mobile-open'));
        else {
          sidebar.classList.toggle('collapsed');
          document.querySelector('.app-main').classList.toggle('sidebar-collapsed');
        }
      };
      sidebarBackdrop.onclick = () => setMobileSidebar(false);
      window.addEventListener('resize', () => {
        if (window.innerWidth > 900) setMobileSidebar(false);
      });
      const savedTheme = localStorage.getItem('cozinhaflow_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      setTheme(savedTheme);
      document.getElementById('themeToggle').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      document.getElementById('logoutButton').onclick = async () => {
        setMobileSidebar(false);
        if (!await UI.confirm('Encerrar sessão', 'Deseja realmente sair do sistema?', 'Sair')) return;
        try { await server('session.logout'); } catch (_) {}
        signedOut();
      };
      document.getElementById('readAllNotifications').onclick = async () => {
        await server('notificacoes.read', { all: true });
        state.notifications = [];
        renderNotifications();
      };
      const search = document.getElementById('globalSearch');
      search?.addEventListener('input', UI.debounce(async () => {
        const host = document.getElementById('searchResults');
        if (search.value.trim().length < 2) { host.classList.add('d-none'); return; }
        try {
          const results = await server('search.global', { query: search.value });
          host.innerHTML = results.length ? results.map(result => `<div class="search-result" data-search-module="${moduleFromSearch(result.module)}"><span class="material-symbols-rounded">search</span><div><strong class="d-block">${UI.esc(result.title)}</strong><small class="text-secondary">${UI.esc(result.type)} · ${UI.esc(result.subtitle)}</small></div></div>`).join('') : UI.empty('Nenhum resultado.');
          host.classList.remove('d-none');
          host.querySelectorAll('[data-search-module]').forEach(item => item.onclick = () => { host.classList.add('d-none'); search.value = ''; navigate(item.dataset.searchModule); });
        } catch (error) { UI.toast(error.message, 'danger'); }
      }, 300));
      if (search) document.addEventListener('click', event => {
        if (!event.target.closest('.global-search')) document.getElementById('searchResults')?.classList.add('d-none');
      });
      document.getElementById('profileForm').addEventListener('submit', async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button');
        UI.loading(button, true);
        try {
          state.user = await server('profile.save', UI.formObject(event.currentTarget));
          renderShell(); event.currentTarget.reset();
          document.querySelector('#profileForm [name=name]').value = state.user.name;
          document.querySelector('#profileForm [name=email]').value = state.user.email;
          UI.toast('Perfil atualizado.');
        } catch (error) { UI.toast(error.message, 'danger'); }
        finally { UI.loading(button, false); }
      });
      document.getElementById('view-perfil').addEventListener('click', async event => {
        const penaltyButton = event.target.closest('[data-penalty-add]');
        if (penaltyButton) { openPenaltyForm(); return; }
        const pushButton = event.target.closest('[data-push-enable]');
        if (pushButton) { await enablePushNotifications(pushButton); return; }
        const pushHelpButton = event.target.closest('[data-push-ios-help]');
        if (pushHelpButton) { openIosInstallHelp(); return; }
        const pushConfigButton = event.target.closest('[data-push-config]');
        if (pushConfigButton) { openPushConfigForm(); return; }
        const addRewardButton = event.target.closest('[data-reward-add]');
        if (addRewardButton) { openRewardForm(); return; }
        const editRewardButton = event.target.closest('[data-reward-edit]');
        if (editRewardButton) {
          const reward = rewardCatalog.find(item => item.id === editRewardButton.dataset.rewardEdit);
          if (reward) openRewardForm(reward);
          return;
        }
        const redeemButton = event.target.closest('[data-reward-redeem]');
        if (redeemButton) {
          const reward = rewardCatalog.find(item => item.id === redeemButton.dataset.rewardRedeem);
          if (!reward || redeemButton.disabled) return;
          const confirmed = await UI.confirm('Resgatar recompensa', `Trocar ${reward.cost} pontos por “${reward.name}”? O pedido será enviado à liderança.`, 'Resgatar');
          if (!confirmed) return;
          UI.loading(redeemButton, true, 'Resgatando...');
          try {
            await server('pontos.resgatar', { rewardId: reward.id });
            celebrateReward(reward);
            UI.toast(`${reward.name} resgatado! A liderança recebeu seu pedido.`, 'success');
            await window.ModuleLoaders.perfil();
          } catch (error) { UI.toast(error.message, 'danger'); }
          finally { UI.loading(redeemButton, false); }
          return;
        }
        const deliverButton = event.target.closest('[data-reward-deliver]');
        if (deliverButton) {
          const confirmed = await UI.confirm('Marcar como entregue', 'Confirma que esta recompensa já foi entregue ao funcionário?', 'Confirmar entrega');
          if (!confirmed) return;
          UI.loading(deliverButton, true, 'Salvando...');
          try {
            await server('pontos.entregar', { id: deliverButton.dataset.rewardDeliver });
            UI.toast('Recompensa marcada como entregue.', 'success');
            await window.ModuleLoaders.perfil();
          } catch (error) { UI.toast(error.message, 'danger'); }
          finally { UI.loading(deliverButton, false); }
        }
      });
      document.getElementById('configForm')?.addEventListener('submit', async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button');
        UI.loading(button, true);
        try { state.config = await server('config.save', UI.formObject(event.currentTarget)); renderShell(); UI.toast('Configurações salvas.'); }
        catch (error) { UI.toast(error.message, 'danger'); }
        finally { UI.loading(button, false); }
      });
      window.ModuleLoaders.configuracoes = async () => {
        if (!document.getElementById('configForm')) return;
        state.config = await server('config.get');
        Object.entries(state.config).forEach(([key, value]) => {
          const input = document.querySelector(`#configForm [name="${key}"]`);
          if (input) input.value = value;
        });
      };
      window.ModuleLoaders.perfil = async () => {
        const panel = document.getElementById('profilePointsPanel');
        if (!panel) return;
        try {
          const [rows, redemptions, catalog, adjustments] = await Promise.all([server('tarefas.list'), server('pontos.resgates'), server('pontos.catalogo'), server('pontos.ajustes')]);
          rewardCatalog = catalog?.length ? catalog : defaultRewardCatalog.slice();
          renderProfileExperience(rows || [], redemptions || [], adjustments || []);
          renderPushSettings();
        } catch (error) {
          panel.innerHTML = `<div class="profile-points-error"><span class="material-symbols-rounded">error</span>${UI.esc(error.message)}</div>`;
        }
      };
    }
    function renderProfileExperience(rows, redemptions, adjustments) {
      const panel = document.getElementById('profilePointsPanel');
      if (!panel) return;
      const ownRows = rows.filter(task => !state.user?.id || String(task.RESPONSAVEL_ID) === String(state.user.id));
      const completed = ownRows.filter(task => task.STATUS === 'Concluída');
      const pointsFor = task => ({ Urgente: 3, Alta: 2, Normal: 1, Baixa: 1 }[task.PRIORIDADE] || 1);
      const grossPoints = completed.reduce((total, task) => total + pointsFor(task), 0);
      const ownAdjustments = adjustments.filter(item => String(item.USUARIO_ID) === String(state.user?.id));
      const lostPoints = ownAdjustments.reduce((total, item) => total + Math.abs(Math.min(0, Number(item.PONTOS || 0))), 0);
      const lifetimePoints = Math.max(0, grossPoints - lostPoints);
      const ownRedemptions = redemptions.filter(item => String(item.USUARIO_ID) === String(state.user?.id));
      const spentPoints = ownRedemptions.filter(item => item.STATUS !== 'Cancelado').reduce((total, item) => total + Number(item.PONTOS || 0), 0);
      const balance = Math.max(0, lifetimePoints - spentPoints);
      let levelIndex = 0;
      kitchenLevels.forEach((candidate, index) => { if (lifetimePoints >= candidate.min) levelIndex = index; });
      const level = kitchenLevels[levelIndex];
      const next = kitchenLevels[levelIndex + 1];
      const progress = next ? Math.min(100, Math.round(((lifetimePoints - level.min) / (next.min - level.min)) * 100)) : 100;
      const today = UI.today();
      const doneToday = completed.filter(task => String(task.CONCLUIDO_EM || '').substring(0, 10) === today).length;
      const recent = completed.slice().sort((a, b) => String(b.CONCLUIDO_EM || '').localeCompare(String(a.CONCLUIDO_EM || ''))).slice(0, 3);
      panel.innerHTML = `
        <div class="profile-score-hero">
          <div class="profile-score-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="profile-level-icon profile-level-emoji">${level.emoji}</div>
          <div class="profile-score-copy"><small>Selo atual</small><strong>${UI.esc(level.name)}</strong><span>${next ? `${next.min - lifetimePoints} pontos para ${next.name}` : 'Você conquistou todos os selos!'}</span></div>
          <div class="profile-score-total"><strong>${balance}</strong><span>saldo</span></div>
        </div>
        <div class="profile-level-track"><span style="width:${progress}%"></span></div>
        <div class="profile-score-stats">
          <div><span class="material-symbols-rounded">task_alt</span><strong>${completed.length}</strong><small>Concluídas</small></div>
          <div><span class="material-symbols-rounded">today</span><strong>${doneToday}</strong><small>Hoje</small></div>
          <div class="${lostPoints ? 'has-point-loss' : ''}"><span class="material-symbols-rounded">trending_down</span><strong>${lostPoints}</strong><small>Perdidos</small></div>
        </div>
        <div class="profile-recent-head"><strong>Últimas conquistas</strong><small>Pontos entram após a aprovação da foto</small></div>
        <div class="profile-achievements">${recent.length ? recent.map((task, index) => `
          <div class="profile-achievement" style="--delay:${index * 70}ms">
            <span class="material-symbols-rounded">verified</span><div><strong>${UI.esc(task.TITULO)}</strong><small>${UI.date(task.CONCLUIDO_EM)}</small></div><b>+${pointsFor(task)}</b>
          </div>`).join('') : '<div class="profile-achievement-empty"><span class="material-symbols-rounded">emoji_events</span><span>Conclua sua primeira tarefa para começar.</span></div>'}</div>`;
      renderKitchenBadges(lifetimePoints);
      renderRewardsStore(balance);
      renderRewardHistory(ownRedemptions, redemptions);
      renderRewardManager();
      renderPointStatement(completed, ownAdjustments, ownRedemptions, pointsFor);
      renderPenaltyManager(adjustments);
      showPendingPointLoss(ownAdjustments);
    }
    function renderKitchenBadges(points) {
      const host = document.getElementById('profileBadgesPanel');
      const unlocked = kitchenLevels.filter(level => points >= level.min).length;
      host.innerHTML = `
        <div class="profile-section-head"><div><small>Jornada da cozinha</small><strong>Seus selos</strong></div><span>${unlocked}/${kitchenLevels.length} desbloqueados</span></div>
        <div class="kitchen-badges-track">${kitchenLevels.map((level, index) => {
          const active = points >= level.min;
          const nextTarget = Math.max(0, level.min - points);
          return `<article class="kitchen-badge ${active ? 'is-unlocked' : 'is-locked'}" style="--delay:${index * 45}ms">
            <div class="kitchen-badge-medal"><span>${active ? level.emoji : '🔒'}</span><i></i></div>
            <strong>${UI.esc(level.name)}</strong>
            <small>${active ? 'Conquistado' : `${nextTarget} pontos para liberar`}</small>
          </article>`;
        }).join('')}</div>`;
    }
    function renderRewardsStore(balance) {
      const host = document.getElementById('profileRewardsStore');
      host.innerHTML = `
        <div class="profile-section-head rewards-head"><div><small>Troque seu esforço</small><strong>Loja de pontos</strong></div><span><b>${balance}</b> disponíveis</span></div>
        <div class="reward-store-note"><span class="material-symbols-rounded">info</span>O pedido vai para a liderança combinar a entrega ou a data.</div>
        <div class="rewards-grid">${rewardCatalog.filter(reward => reward.status !== 'Inativo').map((reward, index) => {
          const canRedeem = balance >= reward.cost;
          return `<article class="reward-card tone-${reward.tone} ${reward.featured ? 'is-featured' : ''}" style="--delay:${index * 35}ms">
            ${reward.featured ? '<span class="reward-featured-label">Recompensa máxima</span>' : ''}
            <div class="reward-emoji">${reward.emoji}</div>
            <div class="reward-copy"><strong>${UI.esc(reward.name)}</strong><small>${UI.esc(reward.description)}</small></div>
            <div class="reward-price"><span class="material-symbols-rounded">stars</span>${reward.cost}</div>
            <button type="button" data-reward-redeem="${reward.id}" ${canRedeem ? '' : 'disabled'}>${canRedeem ? 'Resgatar' : `Faltam ${reward.cost - balance}`}</button>
          </article>`;
        }).join('')}</div>`;
    }
    function renderRewardHistory(ownRedemptions, allRedemptions) {
      const historyHost = document.getElementById('profileRewardHistory');
      const orderedOwn = ownRedemptions.slice().sort((a, b) => String(b.CRIADO_EM || '').localeCompare(String(a.CRIADO_EM || '')));
      historyHost.classList.toggle('d-none', !orderedOwn.length);
      historyHost.innerHTML = orderedOwn.length ? `
        <div class="profile-section-head"><div><small>Acompanhe seus pedidos</small><strong>Meus resgates</strong></div></div>
        <div class="reward-history-list">${orderedOwn.slice(0, 6).map(item => `
          <div class="reward-history-item"><span>${UI.esc(item.EMOJI || '🎁')}</span><div><strong>${UI.esc(item.RECOMPENSA_NOME)}</strong><small>${UI.date(item.CRIADO_EM)}</small></div><b class="status-${String(item.STATUS || 'Solicitado').toLowerCase()}">${UI.esc(item.STATUS || 'Solicitado')}</b></div>`).join('')}</div>` : '';
      const adminHost = document.getElementById('profileAdminRewards');
      const pending = state.user?.role === 'Administrador' ? allRedemptions.filter(item => item.STATUS === 'Solicitado') : [];
      adminHost.classList.toggle('d-none', !pending.length);
      adminHost.innerHTML = pending.length ? `
        <div class="profile-section-head admin-reward-head"><div><small>Ação da liderança</small><strong>Pedidos para entregar</strong></div><span>${pending.length}</span></div>
        <div class="admin-reward-list">${pending.map(item => `
          <article><span>${UI.esc(item.EMOJI || '🎁')}</span><div><strong>${UI.esc(item.USUARIO_NOME)}</strong><small>${UI.esc(item.RECOMPENSA_NOME)} · ${item.PONTOS} pontos</small></div><button type="button" data-reward-deliver="${UI.esc(item.ID)}"><span class="material-symbols-rounded">redeem</span>Entregue</button></article>`).join('')}</div>` : '';
    }
    function renderRewardManager() {
      const host = document.getElementById('profileRewardManager');
      const isAdmin = state.user?.role === 'Administrador';
      host.classList.toggle('d-none', !isAdmin);
      if (!isAdmin) { host.innerHTML = ''; return; }
      host.innerHTML = `
        <div class="profile-section-head reward-manager-head"><div><small>Controle da administradora</small><strong>Gerenciar loja</strong></div><button type="button" data-reward-add><span class="material-symbols-rounded">add</span>Nova</button></div>
        <p class="reward-manager-intro">Edite o preço, os textos e a disponibilidade das recompensas.</p>
        <div class="reward-manager-list">${rewardCatalog.map(reward => `
          <button type="button" data-reward-edit="${UI.esc(reward.id)}"><span>${reward.emoji || '🎁'}</span><div><strong>${UI.esc(reward.name)}</strong><small>${reward.cost} pontos · ${UI.esc(reward.status || 'Ativo')}</small></div><span class="material-symbols-rounded">edit</span></button>`).join('')}</div>`;
    }
    function renderPointStatement(completed, adjustments, redemptions, pointsFor) {
      const host = document.getElementById('profilePointStatement');
      if (!host) return;
      const entries = [
        ...completed.map(task => ({ at: task.CONCLUIDO_EM, title: task.TITULO, detail: 'Tarefa aprovada', points: pointsFor(task), icon: 'task_alt' })),
        ...adjustments.map(item => ({ at: item.CRIADO_EM, title: item.MOTIVO, detail: item.ORIGEM === 'ATRASO' ? 'Punição automática por atraso' : item.ORIGEM === 'NAO_REALIZADA' ? 'Tarefa não realizada' : `Retirado por ${item.ADMIN_NOME || 'Administração'}`, points: Number(item.PONTOS || 0), icon: 'trending_down' })),
        ...redemptions.filter(item => item.STATUS !== 'Cancelado').map(item => ({ at: item.CRIADO_EM, title: item.RECOMPENSA_NOME, detail: 'Resgate na loja', points: -Number(item.PONTOS || 0), icon: 'redeem' }))
      ].sort((a, b) => String(b.at || '').localeCompare(String(a.at || ''))).slice(0, 12);
      host.classList.toggle('d-none', !entries.length);
      host.innerHTML = entries.length ? `<div class="profile-section-head"><div><small>Transparência total</small><strong>Extrato de pontos</strong></div></div><div class="point-statement-list">${entries.map(item => `<article class="${item.points < 0 ? 'is-loss' : 'is-gain'}"><span class="material-symbols-rounded">${item.icon}</span><div><strong>${UI.esc(item.title)}</strong><small>${UI.esc(item.detail)} · ${UI.date(item.at)}</small></div><b>${item.points > 0 ? '+' : ''}${item.points}</b></article>`).join('')}</div>` : '';
    }
    function renderPenaltyManager(adjustments) {
      const host = document.getElementById('profilePenaltyManager');
      if (!host) return;
      const isAdmin = state.user?.role === 'Administrador';
      host.classList.toggle('d-none', !isAdmin);
      if (!isAdmin) { host.innerHTML = ''; return; }
      const recent = adjustments.slice(0, 5);
      host.innerHTML = `<div class="profile-section-head penalty-manager-head"><div><small>Disciplina da equipe</small><strong>Punições de pontos</strong></div><button type="button" data-penalty-add><span class="material-symbols-rounded">remove_circle</span>Retirar pontos</button></div><p class="reward-manager-intro">Toda retirada exige um motivo e aparece no extrato do funcionário.</p>${recent.length ? `<div class="penalty-history-list">${recent.map(item => `<article><span>−${Math.abs(Number(item.PONTOS || 0))}</span><div><strong>${UI.esc(item.USUARIO_NOME)}</strong><small>${UI.esc(item.MOTIVO)} · ${UI.date(item.CRIADO_EM)}</small></div></article>`).join('')}</div>` : '<div class="profile-achievement-empty"><span class="material-symbols-rounded">verified_user</span><span>Nenhuma punição registrada.</span></div>'}`;
    }
    function openPenaltyForm() {
      const users = (state.lookups?.users || []).filter(item => ['Operador', 'Supervisor'].includes(item.role));
      UI.openModal({
        title: 'Retirar pontos', eyebrow: 'Punição administrativa', size: 'sm', formId: 'pointPenaltyForm', submitText: 'Confirmar perda',
        body: `<form id="pointPenaltyForm" class="point-penalty-form"><div class="penalty-warning"><span class="material-symbols-rounded">warning</span><div><strong>Esta ação fica registrada</strong><small>O funcionário verá a perda, o motivo e quem aplicou.</small></div></div><div><label class="form-label">Funcionário</label><select name="userId" class="form-select" required>${UI.options(users, '', 'Selecione...')}</select></div><div><label class="form-label">Quantidade a retirar</label><input name="points" type="number" inputmode="numeric" min="1" max="9999" value="3" class="form-control" required></div><div><label class="form-label">Motivo obrigatório</label><textarea name="reason" class="form-control" rows="3" maxlength="240" placeholder="Ex.: não cumpriu o procedimento informado" required></textarea></div></form>`,
        onSubmit: async form => {
          form.points = Number(form.points);
          const record = await server('pontos.punir', form);
          animatePointLoss(Math.abs(Number(record.PONTOS || form.points)), record.USUARIO_NOME);
          UI.toast(`${record.USUARIO_NOME} perdeu ${Math.abs(Number(record.PONTOS))} ponto(s).`, 'warning');
          await window.ModuleLoaders.perfil();
        }
      });
    }
    function animatePointLoss(points, name = '') {
      const host = document.createElement('div');
      host.className = 'point-loss-celebration';
      host.innerHTML = `<span class="material-symbols-rounded">trending_down</span><strong>−${points}</strong><b>ponto${points > 1 ? 's' : ''}</b>${name ? `<small>${UI.esc(name)}</small>` : ''}${Array.from({ length: 9 }, (_, index) => `<i style="--i:${index}"></i>`).join('')}`;
      document.body.appendChild(host);
      if (navigator.vibrate) navigator.vibrate([80, 45, 110]);
      setTimeout(() => host.remove(), 2200);
    }
    function showPendingPointLoss(adjustments) {
      const latest = adjustments[0];
      if (!latest || Number(latest.PONTOS || 0) >= 0) return;
      const key = `cozinhaflow_last_penalty_${state.user?.id || ''}`;
      if (localStorage.getItem(key) === String(latest.ID)) return;
      localStorage.setItem(key, String(latest.ID));
      setTimeout(() => animatePointLoss(Math.abs(Number(latest.PONTOS)), ''), 280);
    }
    const pushSupported = () => 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window && typeof window.firebase?.messaging === 'function';
    const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    function renderPushSettings() {
      const host = document.getElementById('profilePushSettings');
      if (!host) return;
      const supported = pushSupported(), permission = supported ? Notification.permission : 'unsupported';
      const iosNeedsInstall = isIos() && !isStandalone();
      const configured = Boolean(pushVapidPublicKey());
      let icon = 'notifications_active', title = 'Notificações no telefone', copy = 'Receba tarefas novas, aprovações, devoluções e perdas de pontos.', action = '';
      if (!supported) { icon = 'notifications_off'; copy = 'Este navegador não oferece notificações. Atualize o navegador do telefone.'; }
      else if (iosNeedsInstall) { icon = 'add_to_home_screen'; copy = 'No iPhone, adicione o app à Tela de Início antes de ativar.'; action = '<button type="button" data-push-ios-help>Como instalar</button>'; }
      else if (!configured) { icon = 'settings_alert'; copy = state.user?.role === 'Administrador' ? 'Falta cadastrar a chave pública do Firebase para liberar os avisos reais.' : 'A administração ainda está finalizando a configuração dos avisos.'; action = state.user?.role === 'Administrador' ? '<button type="button" data-push-config>Configurar</button>' : ''; }
      else if (permission === 'granted') { icon = 'notifications_active'; copy = 'Ativadas neste aparelho. Os avisos chegam mesmo com o app fechado.'; action = '<span class="push-enabled-badge"><i></i>Ativadas</span>'; }
      else if (permission === 'denied') { icon = 'notifications_off'; copy = 'Os avisos foram bloqueados. Libere “Notificações” nas configurações do telefone.'; }
      else action = '<button type="button" data-push-enable>Ativar notificações</button>';
      host.innerHTML = `<div class="push-settings-icon"><span class="material-symbols-rounded">${icon}</span></div><div class="push-settings-copy"><small>iPhone e Android</small><strong>${title}</strong><span>${copy}</span></div><div class="push-settings-action">${action}</div>`;
    }
    function openIosInstallHelp() {
      UI.openModal({ title: 'Ativar no iPhone', eyebrow: 'Leva menos de um minuto', size: 'sm', body: '<div class="ios-install-steps"><div><b>1</b><span>Abra este site no <strong>Safari</strong>.</span></div><div><b>2</b><span>Toque em <strong>Compartilhar</strong> na barra do navegador.</span></div><div><b>3</b><span>Escolha <strong>Adicionar à Tela de Início</strong>.</span></div><div><b>4</b><span>Abra o novo ícone e toque em <strong>Ativar notificações</strong>.</span></div></div>', footer: '<button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">Entendi</button>' });
    }
    function openPushConfigForm() {
      UI.openModal({ title: 'Configurar notificações', eyebrow: 'Firebase Cloud Messaging', size: 'sm', formId: 'pushConfigForm', submitText: 'Salvar e ativar', body: `<form id="pushConfigForm" class="point-penalty-form"><div class="penalty-warning push-config-info"><span class="material-symbols-rounded">key</span><div><strong>Chave pública Web Push</strong><small>Cole a chave VAPID gerada no Firebase Console. Ela é pública e segura para ficar no app.</small></div></div><div><label class="form-label">Chave pública</label><textarea name="PUSH_VAPID_PUBLIC_KEY" class="form-control" rows="3" minlength="80" placeholder="B..." required>${UI.esc(pushVapidPublicKey())}</textarea></div></form>`, onSubmit: async form => { state.config = await server('config.save', { PUSH_VAPID_PUBLIC_KEY: String(form.PUSH_VAPID_PUBLIC_KEY || '').trim() }); renderPushSettings(); UI.toast('Chave salva. Agora ative as notificações neste telefone.', 'success'); } });
    }
    function pushDeviceId() {
      const key = 'cozinhaflow_push_device';
      let value = localStorage.getItem(key);
      if (!value) { value = crypto.randomUUID ? crypto.randomUUID() : `device-${Date.now()}-${Math.random().toString(36).slice(2)}`; localStorage.setItem(key, value); }
      return value;
    }
    async function refreshPushRegistration(askPermission = false) {
      if (!pushSupported() || (isIos() && !isStandalone())) return false;
      const vapidKey = pushVapidPublicKey();
      if (!vapidKey) return false;
      let permission = Notification.permission;
      if (askPermission && permission === 'default') permission = await Notification.requestPermission();
      if (permission !== 'granted') return false;
      const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      const messaging = firebase.messaging();
      const token = await messaging.getToken({ vapidKey, serviceWorkerRegistration: registration });
      if (!token) throw new Error('O telefone não forneceu o código de notificação. Tente novamente.');
      await server('push.register', { token, deviceId: pushDeviceId(), platform: isIos() ? 'iOS' : /android/i.test(navigator.userAgent) ? 'Android' : 'Web', userAgent: navigator.userAgent });
      if (!window.__cozinhaPushForegroundBound) {
        window.__cozinhaPushForegroundBound = true;
        messaging.onMessage(payload => {
          const title = payload.notification?.title || payload.data?.title || 'CozinhaFlow';
          const body = payload.notification?.body || payload.data?.body || 'Você recebeu uma atualização.';
          registration.showNotification(title, { body, icon: './app-icon-192.png', badge: './app-icon-192.png', tag: payload.data?.notificationId || 'cozinhaflow', data: { url: './' }, vibrate: [120, 60, 120] });
          UI.toast(`${title}: ${body}`);
        });
      }
      localStorage.setItem(`cozinhaflow_push_ready_${state.user?.id}`, new Date().toISOString());
      return true;
    }
    async function enablePushNotifications(button) {
      if (isIos() && !isStandalone()) { openIosInstallHelp(); return; }
      if (!pushVapidPublicKey()) { state.user?.role === 'Administrador' ? openPushConfigForm() : UI.toast('A administração ainda precisa concluir a configuração.', 'warning'); return; }
      UI.loading(button, true, 'Ativando...');
      try { const active = await refreshPushRegistration(true); if (!active) throw new Error(Notification.permission === 'denied' ? 'As notificações estão bloqueadas nas configurações do telefone.' : 'Permissão de notificação não concedida.'); renderPushSettings(); UI.toast('Notificações reais ativadas neste telefone!', 'success'); }
      catch (error) { UI.toast(error.message, 'danger'); }
      finally { UI.loading(button, false); }
    }
    function openRewardForm(reward = {}) {
      const editing = Boolean(reward.id);
      UI.openModal({
        title: editing ? 'Editar recompensa' : 'Nova recompensa',
        eyebrow: 'Loja de pontos',
        size: 'sm',
        formId: 'rewardAdminForm',
        submitText: editing ? 'Salvar recompensa' : 'Adicionar à loja',
        body: `<form id="rewardAdminForm" class="reward-admin-form">
          <input type="hidden" name="ID" value="${UI.esc(reward.id || '')}">
          <input type="hidden" name="TOM" value="${UI.esc(reward.tone || 'violet')}">
          <div class="reward-admin-main-row"><div><label class="form-label">Emoji</label><input name="EMOJI" class="form-control reward-emoji-input" maxlength="8" value="${UI.esc(reward.emoji || '🎁')}" required></div><div><label class="form-label">Nome da recompensa</label><input name="NOME" class="form-control" maxlength="80" value="${UI.esc(reward.name || '')}" placeholder="Ex.: Vale açaí" required></div></div>
          <div><label class="form-label">Descrição</label><textarea name="DESCRICAO" class="form-control" rows="3" maxlength="240" placeholder="Explique o que a pessoa receberá...">${UI.esc(reward.description || '')}</textarea></div>
          <div class="reward-admin-options"><div><label class="form-label">Valor em pontos</label><input name="PONTOS" type="number" inputmode="numeric" min="1" max="99999" class="form-control" value="${UI.esc(reward.cost || 100)}" required></div><div><label class="form-label">Disponibilidade</label><select name="STATUS" class="form-select"><option ${reward.status !== 'Inativo' ? 'selected' : ''}>Ativo</option><option ${reward.status === 'Inativo' ? 'selected' : ''}>Inativo</option></select></div></div>
          <label class="reward-feature-check"><input name="DESTAQUE" type="checkbox" class="form-check-input" ${reward.featured ? 'checked' : ''}><span><strong>Destacar na loja</strong><small>Mostra a recompensa em um cartão maior.</small></span></label>
        </form>`,
        onSubmit: async form => {
          form.PONTOS = Number(form.PONTOS);
          await server('pontos.recompensa.salvar', form);
          UI.toast(editing ? 'Recompensa atualizada.' : 'Nova recompensa adicionada.', 'success');
          await window.ModuleLoaders.perfil();
        }
      });
    }
    function celebrateReward(reward) {
      const host = document.createElement('div');
      host.className = 'reward-celebration';
      host.innerHTML = `<div class="reward-celebration-emoji">${reward.emoji}</div><strong>Resgatado!</strong><span>${UI.esc(reward.name)}</span>${Array.from({ length: 10 }, (_, index) => `<i style="--i:${index}"></i>`).join('')}`;
      document.body.appendChild(host);
      setTimeout(() => host.remove(), 2100);
    }
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('cozinhaflow_theme', theme);
      document.querySelector('#themeToggle .material-symbols-rounded').textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      window.dispatchEvent(new CustomEvent('themechange'));
    }
    function moduleFromSearch(name) {
      return name === 'operadores' ? 'operadores' : 'tarefas';
    }
    function renderNotifications() {
      const list = document.getElementById('notificationList');
      document.getElementById('notificationDot').classList.toggle('d-none', !state.notifications.length);
      list.innerHTML = state.notifications.length ? state.notifications.map(item => `<div class="alert-item mb-1"><span class="material-symbols-rounded text-${item.SEVERIDADE || 'info'}">notifications</span><div><strong class="d-block">${UI.esc(item.TITULO)}</strong><small class="text-secondary">${UI.esc(item.MENSAGEM)}</small></div></div>`).join('') : UI.empty('Tudo em dia por aqui.');
    }
    function signedOut() {
      clearToken();
      document.getElementById('appShell').classList.add('d-none');
      Login.publicCall('publicBootstrap').then(data => Login.show(true, data));
    }
    const canWrite = resource => {
      const role = state.user?.role;
      if (role === 'Administrador') return true;
      const map = {
        Supervisor: ['tarefas','notificacoes'],
        Operador: ['tarefas','notificacoes']
      };
      return (map[role] || []).includes(resource);
    };
    return { state, boot, start, server, setToken, navigate, canWrite };
  })();
  document.addEventListener('DOMContentLoaded', () => App.boot().catch(error => {
    document.getElementById('bootLoader').classList.add('d-none');
    UI.toast(error.message || 'Falha ao iniciar o sistema.', 'danger');
  }));
</script>
