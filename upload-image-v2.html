<script>
(() => {
  'use strict';

  if (typeof UI === 'undefined' || typeof App === 'undefined') return;

  const MAX_FILE_BYTES = 5 * 1024 * 1024;
  const MAX_SIDE = 1600;
  const JPEG_QUALITY = 0.84;

  const readDataUrl = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('Não foi possível ler a imagem selecionada.'));
    reader.readAsDataURL(file);
  });

  const loadImage = file => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Não foi possível preparar a imagem. Use JPG, PNG ou WEBP.'));
    };
    image.src = url;
  });

  async function prepare(file, metadata = null) {
    if (!file) return null;
    if (file.size > MAX_FILE_BYTES) throw new Error('A imagem deve ter no máximo 5 MB.');
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
      throw new Error('Use uma imagem JPG, PNG ou WEBP.');
    }

    const image = await loadImage(file);
    const scale = Math.min(1, MAX_SIDE / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
    const width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
    const height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));

    if (!metadata && scale === 1 && file.size <= 900 * 1024 && file.type === 'image/jpeg') {
      return { name: file.name, mimeType: file.type, base64: await readDataUrl(file) };
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d', { alpha: false });
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, width, height);
    context.drawImage(image, 0, 0, width, height);

    if (metadata) {
      const padding = Math.max(18, Math.round(width * 0.025));
      const bandHeight = Math.max(92, Math.round(height * 0.15));
      const titleSize = Math.max(18, Math.round(width * 0.027));
      const detailSize = Math.max(14, Math.round(width * 0.019));
      context.fillStyle = 'rgba(18, 20, 30, .78)';
      context.fillRect(0, height - bandHeight, width, bandHeight);
      context.fillStyle = '#ffffff';
      context.font = `700 ${titleSize}px Arial, sans-serif`;
      context.fillText(String(metadata.task || 'Tarefa concluída'), padding, height - bandHeight + padding + titleSize, width - padding * 2);
      context.fillStyle = 'rgba(255,255,255,.85)';
      context.font = `500 ${detailSize}px Arial, sans-serif`;
      context.fillText(`${metadata.user || 'Funcionário'} · ${metadata.capturedAt || new Date().toLocaleString('pt-BR')}`, padding, height - padding, width - padding * 2);
    }

    const baseName = String(file.name || 'foto').replace(/\.[^.]+$/, '') || 'foto';
    return {
      name: `${baseName}.jpg`,
      mimeType: 'image/jpeg',
      base64: canvas.toDataURL('image/jpeg', JPEG_QUALITY)
    };
  }

  UI.uploadImageDetails = async (input, metadata = null) => {
    const file = input?.files?.[0];
    if (!file) return null;
    const payload = await prepare(file, metadata);
    return App.server('media.upload', payload);
  };

  const offlineDb = () => new Promise((resolve, reject) => {
    const request = indexedDB.open('cozinhaflow-offline', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('taskOutbox', { keyPath: 'id' });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const outboxAll = async () => { const db = await offlineDb(); return new Promise((resolve, reject) => { const request = db.transaction('taskOutbox').objectStore('taskOutbox').getAll(); request.onsuccess = () => resolve(request.result || []); request.onerror = () => reject(request.error); }); };
  const outboxPut = async value => { const db = await offlineDb(); return new Promise((resolve, reject) => { const request = db.transaction('taskOutbox', 'readwrite').objectStore('taskOutbox').put(value); request.onsuccess = () => resolve(value); request.onerror = () => reject(request.error); }); };
  const outboxDelete = async id => { const db = await offlineDb(); return new Promise((resolve, reject) => { const request = db.transaction('taskOutbox', 'readwrite').objectStore('taskOutbox').delete(id); request.onsuccess = resolve; request.onerror = () => reject(request.error); }); };
  const OfflineTasks = {
    prepare,
    async enqueue(record) { const value = { ...record, id: `${record.userId}_${record.taskId}`, createdAt: new Date().toISOString() }; await outboxPut(value); window.dispatchEvent(new CustomEvent('taskoutboxchange')); return value; },
    async count() { return (await outboxAll()).filter(item => String(item.userId) === String(App.state.user?.id)).length; },
    async flush() {
      if (!navigator.onLine || !App.state.user) return 0;
      const rows = (await outboxAll()).filter(item => String(item.userId) === String(App.state.user.id)); let sent = 0;
      for (const item of rows) { try { const upload = await App.server('media.upload', item.payload); await App.server('tarefas.complete', { id: item.taskId, CONFIRMADO: true, FOTO_ID: upload.id, OBSERVACAO_CONCLUSAO: item.observation || '' }); await outboxDelete(item.id); sent++; } catch (error) { console.warn('Envio offline ainda pendente:', error.message); break; } }
      if (sent) { UI.toast(`${sent} tarefa(s) offline enviada(s) com sucesso.`, 'success'); window.dispatchEvent(new CustomEvent('taskoutboxchange')); }
      return sent;
    }
  };
  window.addEventListener('online', () => OfflineTasks.flush().catch(() => {}));

  UI.uploadImage = async input => {
    const result = await UI.uploadImageDetails(input);
    return result?.url || '';
  };

  window.ImageUploadV2 = { prepare };
  window.OfflineTasks = OfflineTasks;
})();
</script>
