<section id="view-operadores" class="page-view">
  <div class="page-head">
    <div>
      <span class="eyebrow">Acesso dos funcionários</span>
      <h1>Equipe</h1>
      <p>Cadastre quem recebe as tarefas e envia as fotos de conclusão.</p>
    </div>
    <div class="page-actions">
      <button id="newUserButton" class="btn btn-primary" type="button">
        <span class="material-symbols-rounded">person_add</span>Novo funcionário
      </button>
    </div>
  </div>

  <div class="task-summary-grid team-summary-grid">
    <article class="task-summary-card card-surface">
      <span class="task-summary-icon todo"><span class="material-symbols-rounded">groups</span></span>
      <div><small>Funcionários ativos</small><strong id="teamActiveCount">0</strong></div>
    </article>
    <article class="task-summary-card card-surface">
      <span class="task-summary-icon doing"><span class="material-symbols-rounded">supervisor_account</span></span>
      <div><small>Supervisores</small><strong id="teamSupervisorCount">0</strong></div>
    </article>
  </div>

  <div class="card-surface p-3 p-md-4">
    <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
      <div>
        <h2 class="h5 mb-1">Funcionários com acesso</h2>
        <p class="text-secondary small mb-0">Cada pessoa entra com seu email e vê somente as tarefas atribuídas a ela.</p>
      </div>
      <button id="refreshUsersButton" class="btn btn-light" type="button" title="Atualizar">
        <span class="material-symbols-rounded">refresh</span><span class="d-none d-sm-inline">Atualizar</span>
      </button>
    </div>
    <div id="usersMobileList" class="team-mobile-list" aria-live="polite"></div>
    <div id="usersTable" class="team-desktop-table"></div>
  </div>
</section>
