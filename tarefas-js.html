<script>
  (() => {
    let tasks = [];
    let assignees = [];
    let bound = false;
    let mobileStatus = 'A fazer';
    let attentionFilter = '';
    const statuses = [
      { value: 'A fazer', title: 'A fazer', icon: 'assignment', tone: 'todo' },
      { value: 'Em andamento', title: 'Em andamento', icon: 'pending_actions', tone: 'doing' },
      { value: 'Aguardando aprovação', title: 'Em conferência', icon: 'fact_check', tone: 'review' },
      { value: 'Concluída', title: 'Concluídas', icon: 'verified', tone: 'done' }
    ];

    const isAdmin = () => App.state.user?.role === 'Administrador';
    const isOwner = task => String(task.RESPONSAVEL_ID) === String(App.state.user?.id);
    const isOverdue = task => task.PRAZO && !['Concluída', 'Cancelada'].includes(task.STATUS) &&
      new Date(task.PRAZO).getTime() < Date.now();
    const isDueSoon = task => task.PRAZO && ['A fazer', 'Em andamento'].includes(task.STATUS) &&
      new Date(task.PRAZO).getTime() >= Date.now() && new Date(task.PRAZO).getTime() - Date.now() <= 2 * 60 * 60 * 1000;
    const priorityTone = priority => ({ Urgente: 'urgent', Alta: 'high', Normal: 'normal', Baixa: 'low' }[priority] || 'normal');
    const taskPoints = task => ({ Urgente: 3, Alta: 2, Normal: 1, Baixa: 1 }[task.PRIORIDADE] || 1);
    const plural = (value, singular, pluralForm) => `${value} ${value === 1 ? singular : pluralForm}`;

    function relativeDeadline(value) {
      if (!value) return { text: 'Sem prazo', tone: '' };
      const diffMinutes = Math.round((new Date(value).getTime() - Date.now()) / 60000);
      const absolute = UI.date(value);
      if (diffMinutes < 0) {
        const elapsed = Math.abs(diffMinutes);
        if (elapsed < 60) return { text: `Atrasada há ${plural(elapsed, 'minuto', 'minutos')}`, tone: 'danger', absolute };
        if (elapsed < 1440) return { text: `Atrasada há ${plural(Math.floor(elapsed / 60), 'hora', 'horas')}`, tone: 'danger', absolute };
        return { text: `Atrasada há ${plural(Math.floor(elapsed / 1440), 'dia', 'dias')}`, tone: 'danger', absolute };
      }
      if (diffMinutes < 60) return { text: `Vence em ${plural(Math.max(1, diffMinutes), 'minuto', 'minutos')}`, tone: 'warning', absolute };
      if (diffMinutes < 1440) return { text: `Vence em ${plural(Math.floor(diffMinutes / 60), 'hora', 'horas')}`, tone: 'warning', absolute };
      if (diffMinutes < 2880) return { text: 'Prazo amanhã', tone: '', absolute };
      return { text: absolute, tone: '', absolute };
    }

    async function load() {
      if (!bound) bind();
      document.getElementById('taskBoard').innerHTML = statuses.map(column => `
        <section class="task-column ${column.tone} ${column.value === mobileStatus ? 'mobile-active' : ''}" data-task-status="${column.value}">
          <header class="task-column-head"><span class="skeleton" style="width:120px"></span></header>
          ${UI.skeleton(3)}
        </section>`).join('');
      const requests = [App.server('tarefas.list')];
      if (isAdmin()) requests.push(App.server('tarefas.assignees'));
      const result = await Promise.all(requests);
      tasks = result[0] || [];
      assignees = result[1] || [];
      renderRoleControls();
      render();
    }

    function renderRoleControls() {
      const newButton = document.getElementById('newTaskButton');
      const assigneeFilter = document.getElementById('taskAssigneeFilter');
      newButton.classList.toggle('d-none', !isAdmin());
      assigneeFilter.classList.toggle('d-none', !isAdmin());
      document.getElementById('taskPageEyebrow').textContent = isAdmin() ? 'Rotina da equipe' : 'Meu trabalho';
      document.getElementById('taskPageTitle').textContent = isAdmin() ? 'Tarefas da equipe' : 'Minhas tarefas';
      document.getElementById('taskPageDescription').textContent = isAdmin()
        ? 'Distribua o trabalho, acompanhe o andamento e confira a foto enviada pelo funcionário.'
        : 'Veja o que precisa ser feito, inicie a atividade e envie uma foto ao concluir.';
      const topbarTitle = document.querySelector('.topbar-title strong');
      if (topbarTitle) topbarTitle.textContent = isAdmin() ? 'Tarefas da equipe' : 'Minhas tarefas';
      if (isAdmin()) {
        assigneeFilter.innerHTML = '<option value="">Todos os operadores</option>' +
          assignees.map(item => `<option value="${UI.esc(item.id)}">${UI.esc(item.name)} · ${UI.esc(item.role)}</option>`).join('');
      }
    }

    function filteredTasks() {
      const query = document.getElementById('taskSearch').value.trim().toLowerCase();
      const assignee = document.getElementById('taskAssigneeFilter').value;
      const priority = document.getElementById('taskPriorityFilter').value;
      return tasks.filter(task => {
        const haystack = [task.TITULO, task.DESCRICAO, task.RESPONSAVEL_NOME].join(' ').toLowerCase();
        const matchesAttention = !attentionFilter ||
          (attentionFilter === 'review' && task.STATUS === 'Aguardando aprovação') ||
          (attentionFilter === 'overdue' && isOverdue(task)) ||
          (attentionFilter === 'returned' && task.REVISAO_STATUS === 'Devolvida') ||
          (attentionFilter === 'soon' && isDueSoon(task));
        return matchesAttention && (!query || haystack.includes(query)) &&
          (!assignee || String(task.RESPONSAVEL_ID) === String(assignee)) &&
          (!priority || task.PRIORIDADE === priority);
      });
    }

    function render() {
      const visible = filteredTasks();
      document.getElementById('taskBoard').innerHTML = statuses.map(column => {
        const rows = visible.filter(task => task.STATUS === column.value);
        return `
          <section class="task-column ${column.tone} ${column.value === mobileStatus ? 'mobile-active' : ''}" data-task-status="${UI.esc(column.value)}">
            <header class="task-column-head">
              <span class="task-column-title"><span class="material-symbols-rounded">${column.icon}</span>${column.title}</span>
              <span class="task-column-count">${rows.length}</span>
            </header>
            <div class="task-column-list">
              ${rows.length ? rows.map(taskCard).join('') : `
                <div class="task-column-empty">
                  <span class="material-symbols-rounded">inbox</span>
                  <span>Nenhuma tarefa nesta etapa.</span>
                </div>`}
            </div>
          </section>`;
      }).join('');
      renderMobileTabs(visible);
      renderActiveFilters();
      renderAttentionPanel();

      const canceled = visible.filter(task => task.STATUS === 'Cancelada');
      document.getElementById('taskArchiveCount').textContent = canceled.length;
      document.getElementById('taskArchivePanel').classList.toggle('task-archive-empty', canceled.length === 0);
      document.getElementById('taskArchiveList').innerHTML = canceled.length
        ? canceled.map(taskCard).join('')
        : UI.empty('Nenhuma tarefa cancelada.');

      document.getElementById('taskStatTodo').textContent = tasks.filter(task => task.STATUS === 'A fazer').length;
      document.getElementById('taskStatDoing').textContent = tasks.filter(task => task.STATUS === 'Em andamento').length;
      document.getElementById('taskStatDone').textContent = tasks.filter(task =>
        task.STATUS === 'Concluída' && String(task.CONCLUIDO_EM).substring(0, 10) === UI.today()).length;
      document.getElementById('taskStatOverdue').textContent = tasks.filter(isOverdue).length;
    }

    function renderAttentionPanel() {
      const panel = document.getElementById('taskAttentionPanel');
      panel.classList.toggle('d-none', !isAdmin());
      if (!isAdmin()) return;
      const items = [
        { key: 'review', icon: 'photo_library', label: 'Fotos para conferir', count: tasks.filter(task => task.STATUS === 'Aguardando aprovação').length, tone: 'review' },
        { key: 'overdue', icon: 'timer_off', label: 'Tarefas atrasadas', count: tasks.filter(isOverdue).length, tone: 'danger' },
        { key: 'soon', icon: 'hourglass_top', label: 'Vencem em até 2h', count: tasks.filter(isDueSoon).length, tone: 'warning' },
        { key: 'returned', icon: 'assignment_return', label: 'Fotos devolvidas', count: tasks.filter(task => task.REVISAO_STATUS === 'Devolvida').length, tone: 'returned' }
      ];
      document.getElementById('taskAttentionItems').innerHTML = items.map(item => `
        <button type="button" class="task-attention-item ${item.tone} ${attentionFilter === item.key ? 'active' : ''}" data-attention-filter="${item.key}">
          <span class="material-symbols-rounded">${item.icon}</span>
          <span><strong>${item.count}</strong><small>${item.label}</small></span>
          <span class="material-symbols-rounded">chevron_right</span>
        </button>`).join('');
      document.getElementById('clearAttentionFilter').classList.toggle('d-none', !attentionFilter);
    }

    function renderMobileTabs(visible) {
      const countIds = {
        'A fazer': 'taskMobileTodoCount',
        'Em andamento': 'taskMobileDoingCount',
        'Aguardando aprovação': 'taskMobileReviewCount',
        'Concluída': 'taskMobileDoneCount'
      };
      statuses.forEach(column => {
        const count = visible.filter(task => task.STATUS === column.value).length;
        document.getElementById(countIds[column.value]).textContent = count;
      });
      document.querySelectorAll('[data-task-mobile-status]').forEach(button => {
        const active = button.dataset.taskMobileStatus === mobileStatus;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
    }

    function taskCard(task) {
      const overdue = isOverdue(task);
      const completed = task.STATUS === 'Concluída';
      const awaitingReview = task.STATUS === 'Aguardando aprovação';
      const deadlineInfo = completed
        ? { text: task.PRAZO ? UI.date(task.PRAZO) : 'Sem prazo', tone: '', absolute: '' }
        : relativeDeadline(task.PRAZO);
      const initials = String(task.RESPONSAVEL_NOME || '?').trim().split(/\s+/).slice(0, 2).map(part => part[0]).join('').toUpperCase();
      const description = task.DESCRICAO
        ? `<p class="task-card-description">${UI.esc(task.DESCRICAO)}</p>`
        : '';
      const actions = [];
      if (task.STATUS === 'A fazer' && isOwner(task)) {
        actions.push(taskAction('play_arrow', 'Iniciar tarefa', 'start', task.ID, 'primary'));
      }
      if (task.STATUS === 'Em andamento' && isOwner(task)) {
        actions.push(taskAction('task_alt', 'Concluir com foto', 'complete', task.ID, 'primary'));
      }
      if (['Aguardando aprovação', 'Concluída'].includes(task.STATUS) && task.TEM_FOTO && !task.FOTO_THUMBNAIL_URL) {
        actions.push(taskAction('photo_camera', 'Ver comprovante', 'evidence', task.ID, 'light'));
      }
      if (isAdmin() && awaitingReview) {
        actions.push(taskAction('check_circle', 'Aprovar', 'approve', task.ID, 'success'));
        actions.push(taskAction('add_a_photo', 'Pedir nova foto', 'reject', task.ID, 'light', true));
      }
      if (isAdmin() && ['A fazer', 'Em andamento'].includes(task.STATUS)) {
        actions.push(taskAction('edit', 'Editar', 'edit', task.ID, 'light', true));
        actions.push(taskAction('cancel', 'Cancelar', 'cancel', task.ID, 'light', true));
      }
      if (isAdmin() && ['Concluída', 'Cancelada'].includes(task.STATUS)) {
        actions.push(taskAction('replay', 'Reabrir', 'reopen', task.ID, 'light', true));
      }
      return `
        <article class="task-card ${overdue ? 'is-overdue' : ''} ${completed ? 'is-completed' : ''}" data-task-id="${UI.esc(task.ID)}">
          <div class="task-card-top">
            <span class="task-priority ${priorityTone(task.PRIORIDADE)}"><span></span>${UI.esc(task.PRIORIDADE || 'Normal')}</span>
            <span class="task-points-chip ${completed ? 'is-earned' : ''}"><span class="material-symbols-rounded">${completed ? 'stars' : 'bolt'}</span>${completed ? '+' : ''}${taskPoints(task)} pt${taskPoints(task) > 1 ? 's' : ''}</span>
            ${overdue ? '<span class="task-overdue-label"><span class="material-symbols-rounded">schedule</span>Atrasada</span>' : ''}
            ${awaitingReview ? '<span class="task-review-label"><span class="material-symbols-rounded">fact_check</span>Conferir foto</span>' : ''}
            ${completed ? '<span class="task-completed-label"><span class="material-symbols-rounded">check_circle</span>Concluída</span>' : ''}
          </div>
          <h3>${UI.esc(task.TITULO)}</h3>
          ${description}
          ${task.FOTO_THUMBNAIL_URL && ['Aguardando aprovação', 'Concluída'].includes(task.STATUS) ? `
            <button type="button" class="task-photo-thumbnail" data-task-action="evidence" data-task-id="${UI.esc(task.ID)}" aria-label="Ampliar foto de ${UI.esc(task.TITULO)}">
              <img src="${UI.esc(task.FOTO_THUMBNAIL_URL)}" data-fallback-src="${UI.esc(task.FOTO_THUMBNAIL_FALLBACK_URL || '')}" alt="Comprovante de ${UI.esc(task.TITULO)}" loading="lazy">
              <span><span class="material-symbols-rounded">zoom_in</span>Ampliar comprovante</span>
            </button>` : ''}
          <div class="task-card-assignee">
            <span class="task-assignee-avatar">${UI.esc(initials)}</span>
            <div><small>Responsável</small><strong>${UI.esc(task.RESPONSAVEL_NOME)}</strong></div>
          </div>
          <div class="task-card-schedule">
            <span class="${deadlineInfo.tone ? `is-${deadlineInfo.tone}` : ''}" title="${UI.esc(deadlineInfo.absolute || '')}"><small>Prazo</small><strong><span class="material-symbols-rounded">event</span>${UI.esc(deadlineInfo.text)}</strong>${deadlineInfo.absolute && deadlineInfo.text !== deadlineInfo.absolute ? `<em>${UI.esc(deadlineInfo.absolute)}</em>` : ''}</span>
            ${completed ? `<span class="is-success"><small>Concluída em</small><strong><span class="material-symbols-rounded">check_circle</span>${UI.date(task.CONCLUIDO_EM)}</strong></span>` : ''}
          </div>
          ${task.RECORRENCIA && task.RECORRENCIA !== 'Nenhuma' ? `<div class="task-recurrence"><span class="material-symbols-rounded">event_repeat</span>${UI.esc(task.RECORRENCIA)}${task.TURNO ? ` · ${UI.esc(task.TURNO)}` : ''}</div>` : ''}
          ${task.REVISAO_STATUS === 'Devolvida' ? `<div class="task-review-returned"><span class="material-symbols-rounded">add_a_photo</span><div><strong>Nova foto solicitada</strong><span>${UI.esc(task.MOTIVO_REVISAO || 'Refaça a foto mostrando melhor o resultado.')}</span></div></div>` : ''}
          ${task.STATUS === 'Concluída' && task.OBSERVACAO_CONCLUSAO ? `<div class="task-completion-note"><strong>Observação:</strong> ${UI.esc(task.OBSERVACAO_CONCLUSAO)}</div>` : ''}
          ${actions.length ? `<div class="task-card-actions">${actions.join('')}</div>` : ''}
        </article>`;
    }

    function taskAction(icon, label, action, id, tone, compact) {
      return `<button type="button" class="btn btn-${tone} ${compact ? 'task-icon-action' : 'task-primary-action flex-grow-1'}" data-task-action="${action}" data-task-id="${UI.esc(id)}" title="${UI.esc(label)}" aria-label="${UI.esc(label)}">
        <span class="material-symbols-rounded">${icon}</span>${compact ? `<span class="task-compact-label">${UI.esc(label)}</span>` : `<span>${UI.esc(label)}</span>`}
      </button>`;
    }

    function renderActiveFilters() {
      const host = document.getElementById('taskActiveFilters');
      const assigneeId = document.getElementById('taskAssigneeFilter').value;
      const priority = document.getElementById('taskPriorityFilter').value;
      const chips = [];
      if (assigneeId) {
        const assignee = assignees.find(item => String(item.id) === String(assigneeId));
        if (assignee) chips.push(`<button type="button" data-clear-task-filter="assignee">${UI.esc(assignee.name)}<span class="material-symbols-rounded">close</span></button>`);
      }
      if (priority) chips.push(`<button type="button" data-clear-task-filter="priority">${UI.esc(priority)}<span class="material-symbols-rounded">close</span></button>`);
      host.innerHTML = chips.join('');
      host.classList.toggle('d-none', !chips.length);
      const count = chips.length;
      const badge = document.getElementById('taskFilterCount');
      badge.textContent = count;
      badge.classList.toggle('d-none', count === 0);
    }

    function openTaskFilters() {
      const currentAssignee = document.getElementById('taskAssigneeFilter').value;
      const currentPriority = document.getElementById('taskPriorityFilter').value;
      UI.openModal({
        title: 'Filtrar tarefas',
        eyebrow: 'Encontre mais rápido',
        size: 'sm',
        formId: 'taskFilterForm',
        submitText: 'Aplicar filtros',
        body: `<form id="taskFilterForm" class="row g-3">
          ${isAdmin() ? `<div class="col-12"><label class="form-label">Funcionário</label><select name="assignee" class="form-select"><option value="">Todos os funcionários</option>${assignees.map(item => `<option value="${UI.esc(item.id)}" ${String(item.id) === String(currentAssignee) ? 'selected' : ''}>${UI.esc(item.name)}</option>`).join('')}</select></div>` : ''}
          <div class="col-12"><label class="form-label">Prioridade</label><select name="priority" class="form-select"><option value="">Todas as prioridades</option>${['Urgente', 'Alta', 'Normal', 'Baixa'].map(value => `<option ${value === currentPriority ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
          <div class="col-12"><button id="clearTaskFiltersButton" type="button" class="btn btn-light w-100"><span class="material-symbols-rounded">filter_alt_off</span>Limpar filtros</button></div>
        </form>`,
        onSubmit: async form => {
          document.getElementById('taskAssigneeFilter').value = form.assignee || '';
          document.getElementById('taskPriorityFilter').value = form.priority || '';
          render();
        }
      });
      document.getElementById('clearTaskFiltersButton').onclick = () => {
        const form = document.getElementById('taskFilterForm');
        if (form.elements.assignee) form.elements.assignee.value = '';
        form.elements.priority.value = '';
      };
    }

    function openTaskForm(task = {}) {
      if (!assignees.length) {
        UI.openModal({
          title: 'Cadastre o acesso do operador',
          eyebrow: 'Equipe',
          size: 'sm',
          body: '<p class="text-secondary mb-0">Para atribuir uma tarefa, crie primeiro um <strong>usuário do sistema</strong> com perfil Operador ou Supervisor na tela Operadores.</p>',
          footer: '<button type="button" class="btn btn-light" data-bs-dismiss="modal">Fechar</button><button id="goToUsersButton" type="button" class="btn btn-primary">Ir para Operadores</button>'
        });
        document.getElementById('goToUsersButton').onclick = () => {
          UI.closeModal();
          App.navigate('operadores');
        };
        return;
      }
      const deadline = String(task.PRAZO || '').substring(0, 16);
      const options = assignees.map(item => ({
        id: item.id,
        name: `${item.name} · ${item.role}${item.email ? ` · ${item.email}` : ''}`
      }));
      UI.openModal({
        title: task.ID ? 'Editar tarefa' : 'Nova tarefa',
        eyebrow: 'Distribuição de atividades',
        formId: 'modalForm',
        submitText: task.ID ? 'Salvar alterações' : 'Enviar ao operador',
        body: `
          <form id="modalForm" class="task-form-compact">
            <input type="hidden" name="ID" value="${UI.esc(task.ID || '')}">
            <div class="task-form-main">
            <div class="task-form-field task-title-field">
              <label class="form-label">Função ou tarefa</label>
              <input name="TITULO" class="form-control" maxlength="160" value="${UI.esc(task.TITULO || '')}" placeholder="Ex.: Limpar o forno industrial" required>
            </div>
            <div class="task-form-field">
              <label class="form-label">Operador responsável</label>
              <select name="RESPONSAVEL_ID" class="form-select" required>${UI.options(options, task.RESPONSAVEL_ID, 'Selecione o operador...')}</select>
            </div>
            <fieldset class="task-priority-picker">
              <legend>Prioridade e pontos</legend>
              ${[['Normal','1','routine'],['Alta','2','high'],['Urgente','3','urgent']].map(([value, points, tone]) => `<label class="${tone}"><input type="radio" name="PRIORIDADE" value="${value}" ${value === (task.PRIORIDADE === 'Baixa' ? 'Normal' : (task.PRIORIDADE || 'Normal')) ? 'checked' : ''} required><span><i></i><strong>${value}</strong><small>+${points} pt${points === '1' ? '' : 's'}</small></span></label>`).join('')}
            </fieldset>
            </div>
            <details class="task-form-more" ${task.ID || task.DESCRICAO || task.ORIENTACAO_FOTO || task.PRAZO || (task.RECORRENCIA && task.RECORRENCIA !== 'Nenhuma') ? 'open' : ''}>
              <summary><span class="material-symbols-rounded">tune</span><span><strong>Orientações, prazo e repetição</strong><small>Opcional</small></span><span class="material-symbols-rounded task-more-chevron">expand_more</span></summary>
              <div class="task-form-more-body">
            <div class="task-form-field">
              <label class="form-label">Orientações</label>
              <textarea name="DESCRICAO" class="form-control" rows="3" maxlength="1500" placeholder="Como a atividade deve ser feita?">${UI.esc(task.DESCRICAO || '')}</textarea>
            </div>
            <div class="task-form-field">
              <label class="form-label">O que deve aparecer na foto</label>
              <input name="ORIENTACAO_FOTO" class="form-control" maxlength="300" value="${UI.esc(task.ORIENTACAO_FOTO || '')}" placeholder="Ex.: forno inteiro e parte interna">
            </div>
            <div class="task-form-options-grid">
            <div class="task-form-field">
              <label class="form-label">Prazo</label>
              <input name="PRAZO" type="datetime-local" class="form-control" value="${UI.esc(deadline)}">
            </div>
            <div class="task-form-field">
              <label class="form-label">Repetição</label>
              <select id="taskRecurrence" name="RECORRENCIA" class="form-select">
                ${['Nenhuma', 'Diária', 'Dias específicos'].map(value => `<option ${value === (task.RECORRENCIA || 'Nenhuma') ? 'selected' : ''}>${value}</option>`).join('')}
              </select>
            </div>
            </div>
            <div id="taskRecurrenceFields" class="${!task.RECORRENCIA || task.RECORRENCIA === 'Nenhuma' ? 'd-none' : ''}">
              <div class="task-recurrence-form">
                <div><label class="form-label">Turno</label><select name="TURNO" class="form-select"><option value="">Sem turno</option>${['Abertura', 'Almoço', 'Fechamento'].map(value => `<option ${value === task.TURNO ? 'selected' : ''}>${value}</option>`).join('')}</select></div>
                <div><label class="form-label">Horário limite</label><input name="RECORRENCIA_HORA" type="time" class="form-control" value="${UI.esc(task.RECORRENCIA_HORA || deadline.substring(11, 16) || '18:00')}"></div>
                <div id="taskWeekdayFields" class="task-weekdays ${task.RECORRENCIA === 'Dias específicos' ? '' : 'd-none'}">
                  <span>Repetir nestes dias</span>
                  ${[['1','Seg'],['2','Ter'],['3','Qua'],['4','Qui'],['5','Sex'],['6','Sáb'],['0','Dom']].map(([value, label]) => `<label><input type="checkbox" name="RECORRENCIA_DIAS" value="${value}" ${String(task.RECORRENCIA_DIAS || '').split(',').includes(value) ? 'checked' : ''}><span>${label}</span></label>`).join('')}
                </div>
              </div>
            </div>
              </div>
            </details>
          </form>`,
        onSubmit: async form => {
          if (form.RECORRENCIA === 'Dias específicos' && (!form.RECORRENCIA_DIAS || !form.RECORRENCIA_DIAS.length)) {
            throw new Error('Escolha pelo menos um dia da semana.');
          }
          if (form.RECORRENCIA !== 'Nenhuma') {
            const date = String(form.PRAZO || `${UI.today()}T${form.RECORRENCIA_HORA || '18:00'}`).substring(0, 10);
            form.PRAZO = `${date}T${form.RECORRENCIA_HORA || '18:00'}`;
            form.OCORRENCIA_DATA = date;
          }
          await App.server('tarefas.save', form);
          UI.toast(task.ID ? 'Tarefa atualizada.' : 'Tarefa enviada ao operador.');
          await load();
        }
      });
      const recurrence = document.getElementById('taskRecurrence');
      const recurrenceFields = document.getElementById('taskRecurrenceFields');
      const weekdayFields = document.getElementById('taskWeekdayFields');
      recurrence.onchange = () => {
        recurrenceFields.classList.toggle('d-none', recurrence.value === 'Nenhuma');
        weekdayFields.classList.toggle('d-none', recurrence.value !== 'Dias específicos');
      };
    }

    async function startTask(task) {
      if (!await UI.confirm('Iniciar tarefa', `Deseja iniciar “${task.TITULO}”?`, 'Iniciar')) return;
      await App.server('tarefas.start', { id: task.ID });
      mobileStatus = 'Em andamento';
      UI.toast('Tarefa movida para Em andamento.');
      await load();
    }

    function completeTask(task) {
      UI.openModal({
        title: 'Concluir tarefa',
        eyebrow: 'Confirmação obrigatória',
        formId: 'taskCompleteForm',
        submitText: 'Confirmar conclusão',
        body: `
          <form id="taskCompleteForm" class="row g-3">
            <input type="hidden" name="id" value="${UI.esc(task.ID)}">
            <div class="col-12">
              <div class="task-complete-summary">
                <span class="material-symbols-rounded">assignment_turned_in</span>
                <div><small>Tarefa</small><strong>${UI.esc(task.TITULO)}</strong></div>
              </div>
            </div>
            <div class="col-12">
              <div class="task-camera-guide">
                <span class="material-symbols-rounded">center_focus_strong</span>
                <div><small>Mostre na foto</small><strong>${UI.esc(task.ORIENTACAO_FOTO || `o resultado completo de “${task.TITULO}”`)}</strong><span>A foto receberá automaticamente data, hora e seu nome.</span></div>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label">Foto da atividade concluída</label>
              <input id="taskEvidenceFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" class="task-photo-input" required>
              <label class="task-photo-picker" for="taskEvidenceFile">
                <span class="material-symbols-rounded">photo_camera</span>
                <span><strong>Tirar ou escolher foto</strong><small id="taskPhotoFileName">Nenhuma foto selecionada</small></span>
              </label>
              <small class="form-text text-secondary">Confira a prévia antes de enviar. Máximo de 5 MB.</small>
              <div id="taskPhotoPreview" class="task-photo-preview d-none"></div>
            </div>
            <div class="col-12">
              <label class="form-label">Observação da conclusão (opcional)</label>
              <textarea name="OBSERVACAO_CONCLUSAO" class="form-control" rows="3" maxlength="1000" placeholder="Informe algum detalhe importante..."></textarea>
            </div>
            <div class="col-12">
              <label class="task-confirm-check">
                <input name="CONFIRMADO" type="checkbox" class="form-check-input" required>
                <span><strong>Confirmo que executei esta tarefa.</strong><small>A conclusão ficará registrada com meu usuário, data, hora e foto.</small></span>
              </label>
            </div>
          </form>`,
        onSubmit: async form => {
          if (form.CONFIRMADO !== true) throw new Error('Marque a confirmação de execução.');
          const upload = await UI.uploadImageDetails(document.getElementById('taskEvidenceFile'), {
            task: task.TITULO,
            user: App.state.user?.name || task.RESPONSAVEL_NOME,
            capturedAt: new Date().toLocaleString('pt-BR')
          });
          if (!upload) throw new Error('A foto de conclusão é obrigatória.');
          await App.server('tarefas.complete', {
            id: task.ID,
            CONFIRMADO: true,
            FOTO_ID: upload.id,
            OBSERVACAO_CONCLUSAO: form.OBSERVACAO_CONCLUSAO || ''
          });
          mobileStatus = 'Aguardando aprovação';
          UI.toast('Foto enviada. A tarefa está aguardando conferência.');
          await load();
        }
      });
      const input = document.getElementById('taskEvidenceFile');
      input.onchange = () => {
        const preview = document.getElementById('taskPhotoPreview');
        const fileName = document.getElementById('taskPhotoFileName');
        const file = input.files?.[0];
        if (!file) { fileName.textContent = 'Nenhuma foto selecionada'; preview.classList.add('d-none'); preview.innerHTML = ''; return; }
        fileName.textContent = file.name;
        const url = URL.createObjectURL(file);
        preview.innerHTML = `<img src="${url}" alt="Prévia da foto"><span><strong>Foto pronta para enviar</strong><small>Toque em “Tirar ou escolher foto” para trocar.</small></span>`;
        preview.classList.remove('d-none');
      };
    }

    async function showEvidence(task) {
      UI.openModal({
        title: 'Carregando comprovante',
        eyebrow: 'Evidência da conclusão',
        body: UI.skeleton(5),
        footer: '<button type="button" class="btn btn-light" data-bs-dismiss="modal">Fechar</button>'
      });
      try {
        const evidence = await App.server('tarefas.evidence', { id: task.ID });
        document.getElementById('modalTitle').textContent = evidence.title;
        document.getElementById('modalBody').innerHTML = `
          <div class="task-evidence">
            <div class="task-evidence-viewer">
              <img id="taskEvidenceImage" src="${UI.esc(evidence.dataUrl)}" data-fallback-src="${UI.esc(evidence.fallbackUrl || '')}" alt="Foto de conclusão de ${UI.esc(evidence.title)}">
              ${evidence.previewUrl ? `<iframe id="taskEvidenceDrivePreview" class="d-none" src="${UI.esc(evidence.previewUrl)}" title="Prévia da foto no Google Drive" loading="lazy" allow="autoplay"></iframe>` : ''}
            </div>
            <div class="task-evidence-info">
              <span><span class="material-symbols-rounded">person</span><strong>${UI.esc(evidence.operator)}</strong></span>
              <span><span class="material-symbols-rounded">schedule</span>${UI.date(evidence.completedAt)}</span>
            </div>
            ${evidence.observation ? `<p><strong>Observação:</strong> ${UI.esc(evidence.observation)}</p>` : ''}
            ${evidence.driveUrl ? `<a class="task-evidence-drive-link" href="${UI.esc(evidence.driveUrl)}" target="_blank" rel="noopener"><span class="material-symbols-rounded">open_in_new</span>Abrir foto no Google Drive</a>` : ''}
          </div>`;
        const image = document.getElementById('taskEvidenceImage');
        if (image) image.onerror = () => {
          const fallback = image.dataset.fallbackSrc;
          if (fallback && image.src !== fallback && image.dataset.fallbackTried !== 'true') {
            image.dataset.fallbackTried = 'true';
            image.src = fallback;
            return;
          }
          image.classList.add('d-none');
          document.getElementById('taskEvidenceDrivePreview')?.classList.remove('d-none');
        };
      } catch (error) {
        UI.closeModal();
        UI.toast(error.message, 'danger');
      }
    }

    async function approveTask(task) {
      if (!await UI.confirm('Aprovar conclusão', `A foto de “${task.TITULO}” comprova que a tarefa foi executada?`, 'Aprovar tarefa')) return;
      await App.server('tarefas.approve', { id: task.ID });
      mobileStatus = 'Concluída';
      celebrateTaskPoints(taskPoints(task));
      UI.toast(`Tarefa aprovada! +${taskPoints(task)} ponto${taskPoints(task) > 1 ? 's' : ''} para ${task.RESPONSAVEL_NOME}.`, 'success');
      await load();
    }

    function celebrateTaskPoints(points) {
      const host = document.createElement('div');
      host.className = 'task-points-celebration';
      host.innerHTML = `<strong>+${points}</strong><span>ponto${points > 1 ? 's' : ''}</span>${Array.from({ length: 8 }, (_, index) => `<i style="--i:${index}"></i>`).join('')}`;
      document.body.appendChild(host);
      setTimeout(() => host.remove(), 1500);
    }

    function rejectTask(task) {
      UI.openModal({
        title: 'Pedir nova foto',
        eyebrow: 'Devolução ao funcionário',
        size: 'sm',
        formId: 'taskRejectForm',
        submitText: 'Devolver tarefa',
        body: `<form id="taskRejectForm" class="row g-3">
          <div class="col-12"><div class="task-complete-summary"><span class="material-symbols-rounded">add_a_photo</span><div><small>Tarefa</small><strong>${UI.esc(task.TITULO)}</strong></div></div></div>
          <div class="col-12"><label class="form-label">O que precisa ser corrigido?</label><div class="task-reject-presets">
            ${['Foto escura', 'Resultado incompleto', 'Não mostra a área inteira'].map(reason => `<button type="button" data-reject-reason="${UI.esc(reason)}">${UI.esc(reason)}</button>`).join('')}
          </div><textarea name="reason" class="form-control mt-2" rows="3" maxlength="300" placeholder="Explique ao funcionário o que deve aparecer na nova foto..." required></textarea></div>
        </form>`,
        onSubmit: async form => {
          await App.server('tarefas.reject', { id: task.ID, reason: form.reason });
          mobileStatus = 'Em andamento';
          UI.toast('Tarefa devolvida com a orientação para nova foto.', 'warning');
          await load();
        }
      });
      const textarea = document.querySelector('#taskRejectForm [name=reason]');
      document.querySelectorAll('[data-reject-reason]').forEach(button => {
        button.onclick = () => { textarea.value = button.dataset.rejectReason; textarea.focus(); };
      });
    }

    async function cancelTask(task) {
      if (!await UI.confirm('Cancelar tarefa', `Cancelar “${task.TITULO}”? O registro permanecerá no arquivo.`, 'Cancelar tarefa', true)) return;
      await App.server('tarefas.cancel', { id: task.ID });
      UI.toast('Tarefa cancelada.', 'warning');
      await load();
    }

    async function reopenTask(task) {
      if (!await UI.confirm('Reabrir tarefa', `Reabrir “${task.TITULO}”? O operador precisará enviar uma nova foto.`, 'Reabrir')) return;
      await App.server('tarefas.reopen', { id: task.ID });
      mobileStatus = 'A fazer';
      UI.toast('Tarefa reaberta e devolvida ao operador.');
      await load();
    }

    async function handleAction(action, id) {
      const task = tasks.find(item => String(item.ID) === String(id));
      if (!task) return;
      try {
        if (action === 'edit') openTaskForm(task);
        if (action === 'start') await startTask(task);
        if (action === 'complete') completeTask(task);
        if (action === 'evidence') await showEvidence(task);
        if (action === 'approve') await approveTask(task);
        if (action === 'reject') rejectTask(task);
        if (action === 'cancel') await cancelTask(task);
        if (action === 'reopen') await reopenTask(task);
      } catch (error) {
        UI.toast(error.message, 'danger');
      }
    }

    function bind() {
      bound = true;
      document.getElementById('newTaskButton').onclick = () => openTaskForm();
      document.getElementById('refreshTasksButton').onclick = load;
      document.getElementById('taskFilterButton').onclick = openTaskFilters;
      document.getElementById('clearAttentionFilter').onclick = () => { attentionFilter = ''; render(); };
      document.getElementById('taskSearch').addEventListener('input', UI.debounce(render, 120));
      document.getElementById('taskAssigneeFilter').onchange = render;
      document.getElementById('taskPriorityFilter').onchange = render;
      document.getElementById('view-tarefas').addEventListener('click', event => {
        const attention = event.target.closest('[data-attention-filter]');
        if (attention) {
          attentionFilter = attentionFilter === attention.dataset.attentionFilter ? '' : attention.dataset.attentionFilter;
          if (attentionFilter === 'review') mobileStatus = 'Aguardando aprovação';
          if (attentionFilter === 'returned') mobileStatus = 'Em andamento';
          if (attentionFilter === 'overdue') mobileStatus = tasks.find(isOverdue)?.STATUS || 'A fazer';
          if (attentionFilter === 'soon') mobileStatus = tasks.find(isDueSoon)?.STATUS || 'A fazer';
          render();
          return;
        }
        const clearFilter = event.target.closest('[data-clear-task-filter]');
        if (clearFilter) {
          const filter = clearFilter.dataset.clearTaskFilter;
          document.getElementById(filter === 'assignee' ? 'taskAssigneeFilter' : 'taskPriorityFilter').value = '';
          render();
          return;
        }
        const tab = event.target.closest('[data-task-mobile-status]');
        if (tab) {
          attentionFilter = '';
          mobileStatus = tab.dataset.taskMobileStatus;
          render();
          return;
        }
        const button = event.target.closest('[data-task-action]');
        if (button) handleAction(button.dataset.taskAction, button.dataset.taskId);
      });
      document.getElementById('view-tarefas').addEventListener('error', event => {
        const image = event.target.closest?.('.task-photo-thumbnail img');
        if (!image) return;
        const fallback = image.dataset.fallbackSrc;
        if (fallback && image.dataset.fallbackTried !== 'true') {
          image.dataset.fallbackTried = 'true';
          image.src = fallback;
          return;
        }
        image.closest('.task-photo-thumbnail')?.classList.add('is-broken');
      }, true);
    }

    window.ModuleLoaders.tarefas = load;
  })();
</script>
