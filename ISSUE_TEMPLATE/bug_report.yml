name: Relatar problema
description: Informe um erro reproduzível no CozinhaFlow ERP
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que aconteceu e o que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra...\n2. Toque em...\n3. Veja o erro..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: "1.5.0"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      options:
        - Celular
        - Tablet
        - Computador
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Adicione prints sem senhas, tokens ou dados pessoais.
