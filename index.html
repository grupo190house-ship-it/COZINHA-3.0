        if(action==='dashboard.get') return previewDashboard;
        if(action==='compras.refresh') return {created:0,updated:2};
        return previewRows[action] || [];
      };

      const makeRunner=(success,failure)=>new Proxy({},{
        get(target,prop){
          if(prop==='withSuccessHandler') return handler=>makeRunner(handler,failure);
          if(prop==='withFailureHandler') return handler=>makeRunner(success,handler);
          return (...args)=>setTimeout(()=>{
            if(prop==='publicBootstrap') success?.({ok:true,data:{installed:true,appName:'CozinhaFlow ERP',companyName:'Cozinha Industrial Aurora',version:'1.5.0'}});
            else if(prop==='apiRequest') success?.({ok:true,data:mockData(args[0])});
            else success?.({ok:true,data:null});
          },80);
        }
      });
      window.google={script:{run:makeRunner()}};

      (() => {
        'use strict';

        const text = async name => {
          const response = await fetch(new URL(name, document.baseURI), { cache: 'no-store' });
          if (!response.ok) throw new Error(`Não foi possível carregar ${name} (${response.status}).`);
          return response.text();
        };

        const setHtml = async (selector, file) => {
          const target = document.querySelector(selector);
          if (!target) throw new Error(`Área da interface não encontrada: ${selector}`);
          target.innerHTML = await text(file);
        };

        const loadScriptFragment = async file => {
          const source = await text(file);
          const match = source.match(/^\s*<script[^>]*>([\s\S]*)<\/script>\s*$/i);
          const script = document.createElement('script');
          script.textContent = match ? match[1] : source;
          script.dataset.source = file;
          document.body.appendChild(script);
        };

        const showFailure = error => {
          console.error(error);
          document.body.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:#f5f7fb"><section style="width:min(520px,100%);padding:30px;border:1px solid #e2e7f0;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(32,45,75,.12);text-align:center"><span class="material-symbols-rounded" style="font-size:42px;color:#b42318">error</span><h1 style="font-size:22px">Erro ao carregar a interface</h1><p style="color:#667085">${String(error?.message || error)}</p><button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></section></main>`;
        };

        async function bootPages() {
          const [styles, theme] = await Promise.all([text('styles.html'), text('theme.html')]);

          document.body.innerHTML = `
            <div id="bootLoader" class="boot-loader">
              <div class="brand-mark"><span class="material-symbols-rounded">skillet</span></div>
              <div class="spinner-border text-primary" role="status"></div>
              <span>Preparando seu ambiente...</span>
            </div>
            <div id="loginMount"></div>
            <div id="appShell" class="app-shell d-none">
              <div id="sidebarMount"></div>
              <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>
              <div class="app-main">
                <div id="navbarMount"></div>
                <main id="pageContent" class="page-content"></main>
                <div id="footerMount"></div>
              </div>
              <div id="mobileNavMount"></div>
            </div>
            <div id="toastHost" class="toast-container position-fixed top-0 end-0 p-3"></div>
            <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
              <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                  <div class="modal-header">
                    <div><span class="eyebrow" id="modalEyebrow"></span><h5 class="modal-title" id="modalTitle"></h5></div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                  </div>
                  <div class="modal-body" id="modalBody"></div>
                  <div class="modal-footer" id="modalFooter"></div>
                </div>
              </div>
            </div>
            <div class="pages-mode-banner"><strong>Modo demonstração:</strong> dados de exemplo. Para salvar dados reais, publique como Aplicativo da Web no Google Apps Script.</div>`;

          await Promise.all([
            setHtml('#loginMount', 'login.html'),
            setHtml('#sidebarMount', 'sidebar.html'),
            setHtml('#navbarMount', 'navbar.html'),
            setHtml('#footerMount', 'footer.html'),
            setHtml('#mobileNavMount', 'mobile-nav.html')
          ]);

          const pages = ['dashboard','tarefas','estoque','insumos','produtos','producao','compras','fornecedores','inventario','perdas','relatorios','operadores','auditoria','configuracoes','perfil'];
          const pageMarkup = await Promise.all(pages.map(name => text(`${name}.html`)));
          document.getElementById('pageContent').innerHTML = pageMarkup.join('\n');

          for (const file of ['utils-js.html','app-js.html','tarefas-js.html','dashboard-js.html','estoque-js.html','compras-js.html','inventario-js.html','login-js.html']) {
            await loadScriptFragment(file);
          }

          if (document.readyState !== 'loading') {
            const starter = document.createElement('script');
            starter.textContent = "App.boot().catch(error => { document.getElementById('bootLoader')?.classList.add('d-none'); UI.toast(error.message || 'Falha ao iniciar o sistema.', 'danger'); });";
            document.body.appendChild(starter);
          }
        }

        bootPages().catch(showFailure);
      })();
    }
