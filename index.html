<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="CozinhaFlow ERP — estoque, produção, compras e tarefas operacionais.">
  <title>CozinhaFlow ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
</head>
<body>
  <div id="initialLoader" style="min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#0c66e4;color:#fff">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="spinner-border" role="status"></div>
      <strong>Conectando ao seu quadro...</strong>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      'use strict';
      const ASSET_VERSION = '20260729-mobile-2';
      const fetchText = async file => {
        const url = new URL(file, document.baseURI);
        url.searchParams.set('v', ASSET_VERSION);
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Não foi possível carregar ${file} (${response.status}).`);
        return response.text();
      };
      const insertScriptFragment = async file => {
        const source = await fetchText(file);
        const match = source.match(/^\s*<script[^>]*>([\s\S]*)<\/script>\s*$/i);
        const script = document.createElement('script');
        script.textContent = match ? match[1] : source;
        script.dataset.source = file;
        document.body.appendChild(script);
      };
      const mount = async (selector, file) => {
        const target = document.querySelector(selector);
        if (!target) throw new Error(`Área não encontrada: ${selector}`);
        target.innerHTML = await fetchText(file);
      };
      const fail = error => {
        console.error(error);
        document.body.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#0c66e4,#0052cc 60%,#172b4d)"><section style="width:min(560px,100%);padding:32px;border-radius:12px;background:#fff;box-shadow:0 18px 55px rgba(9,30,66,.35);text-align:center"><span class="material-symbols-rounded" style="font-size:46px;color:#ca3521">error</span><h1 style="font-size:23px;margin-top:12px;color:#172b4d">Erro ao abrir o quadro</h1><p style="color:#626f86">${String(error?.message || error)}</p><button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></section></main>`;
      };
      async function boot() {
        const [styles, theme, trelloTheme, mobilePolish] = await Promise.all([
          fetchText('styles.html'),
          fetchText('theme.html'),
          fetchText('trello-theme.html'),
          fetchText('mobile-polish.html')
        ]);
        document.head.insertAdjacentHTML('beforeend', styles + theme + trelloTheme + mobilePolish + '<style>.firebase-status{position:fixed;right:14px;bottom:72px;z-index:1085;padding:7px 11px;border-radius:999px;background:rgba(16,24,40,.88);color:#fff;font:600 11px Inter,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.18);pointer-events:none}.firebase-status::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#12b76a}@media(min-width:901px){.firebase-status{bottom:14px}}</style>');
        document.body.innerHTML = `
          <div id="bootLoader" class="boot-loader"><div class="brand-mark"><span class="material-symbols-rounded">view_kanban</span></div><div class="spinner-border text-primary" role="status"></div><span>Organizando seu quadro...</span></div>
          <div id="loginMount"></div>
          <div id="appShell" class="app-shell d-none">
            <div id="sidebarMount"></div>
            <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>
            <div class="app-main"><div id="navbarMount"></div><main id="pageContent" class="page-content"></main><div id="footerMount"></div></div>
            <div id="mobileNavMount"></div>
          </div>
          <div id="toastHost" class="toast-container position-fixed top-0 end-0 p-3"></div>
          <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><div><span class="eyebrow" id="modalEyebrow"></span><h5 class="modal-title" id="modalTitle"></h5></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div></div>
          <div class="firebase-status">Firebase + Google Drive</div>`;
        await Promise.all([
          mount('#loginMount','login.html'), mount('#sidebarMount','sidebar.html'), mount('#navbarMount','navbar.html'), mount('#footerMount','footer.html'), mount('#mobileNavMount','mobile-nav.html')
        ]);
        const pages=['dashboard','tarefas','estoque','insumos','produtos','producao','compras','fornecedores','inventario','perdas','relatorios','operadores','auditoria','configuracoes','perfil'];
        document.getElementById('pageContent').innerHTML=(await Promise.all(pages.map(name=>fetchText(`${name}.html`)))).join('\n');
        for(const file of ['firebase-adapter.html','drive-adapter.html','utils-js.html','app-js.html','tarefas-js.html','dashboard-js.html','estoque-js.html','compras-js.html','inventario-js.html','login-js.html']) await insertScriptFragment(file);
        await App.boot();
      }
      boot().catch(fail);
    })();
  </script>
</body>
</html>
