<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="CozinhaFlow Tarefas — atividades da equipe com comprovação por foto no Google Drive.">
  <title>CozinhaFlow Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
</head>
<body>
  <div id="initialLoader" style="min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#f8f4ff,#fff7f0);color:#25263a">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="spinner-border" role="status" style="color:#8b5cf6"></div>
      <strong>Preparando a operação...</strong>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (() => {
      'use strict';
      const ASSET_VERSION = '20260816-mobile-pontos-v5';
      localStorage.setItem('cozinhaflow_theme', 'light');

      const stopZoom = event => event.preventDefault();
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => document.addEventListener(type, stopZoom, { passive: false }));
      document.addEventListener('touchmove', event => {
        if (event.touches && event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      document.addEventListener('dblclick', stopZoom, { passive: false });

      const fetchText = async file => {
        const url = new URL(file, document.baseURI);
        url.searchParams.set('v', ASSET_VERSION);
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Não foi possível carregar ${file} (${response.status}).`);
        return response.text();
      };

      const insertScriptFragment = async file => {
        const source = await fetchText(file);
        const match = source.match(/^\s*<script[^>]*>([\s\S]*)<\/script>\s*$/i);
        const script = document.createElement('script');
        script.textContent = match ? match[1] : source;
        script.dataset.source = file;
        document.body.appendChild(script);
      };

      const mount = async (selector, file) => {
        const target = document.querySelector(selector);
        if (!target) throw new Error(`Área não encontrada: ${selector}`);
        target.innerHTML = await fetchText(file);
      };

      const fail = error => {
        console.error(error);
        document.body.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:#f7f7fb"><section style="width:min(560px,100%);padding:32px;border:1px solid #e8e7f0;border-radius:20px;background:#fff;box-shadow:0 24px 70px rgba(48,39,82,.14);text-align:center"><span class="material-symbols-rounded" style="font-size:46px;color:#ef5b67">error</span><h1 style="font-size:23px;margin-top:12px;color:#25263a">Erro ao abrir a operação</h1><p style="color:#7b7e92">${String(error?.message || error)}</p><button class="btn btn-primary" onclick="location.reload()">Tentar novamente</button></section></main>`;
      };

      async function boot() {
        const [
          styles,
          theme,
          trelloTheme,
          mobilePolish,
          mobileV2,
          productionStyle,
          lossesStyle,
          simpleModern,
          productionCompact,
          stockCompact,
          mobileMenuFix,
          cangeTheme,
          taskMobileRedesign
        ] = await Promise.all([
          fetchText('styles.html'),
          fetchText('theme.html'),
          fetchText('trello-theme.html'),
          fetchText('mobile-polish.html'),
          fetchText('mobile-v2.html'),
          fetchText('producao-v2-style.html'),
          fetchText('perdas-v2-style.html'),
          fetchText('simple-modern.html'),
          fetchText('producao-compact.html'),
          fetchText('estoque-compact-style.html'),
          fetchText('mobile-menu-fix.html'),
          fetchText('cange-theme.html'),
          fetchText('task-mobile-redesign.html')
        ]);

        document.head.insertAdjacentHTML(
          'beforeend',
          styles + theme + trelloTheme + mobilePolish + mobileV2 + productionStyle + lossesStyle + simpleModern + productionCompact + stockCompact + mobileMenuFix + cangeTheme + taskMobileRedesign +
          '<style>html,body{touch-action:pan-x pan-y}@media(max-width:900px){input,select,textarea,.form-control,.form-select{font-size:16px!important}}.firebase-status{position:fixed;right:14px;bottom:72px;z-index:1085;padding:7px 11px;border:1px solid #e8e7f0;border-radius:999px;background:#fff;color:#5f6275;font:650 10px Inter,sans-serif;box-shadow:0 7px 22px rgba(48,39,82,.08);pointer-events:none}.firebase-status::before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#22c55e}@media(min-width:901px){.firebase-status{bottom:14px}}</style>'
        );

        document.body.innerHTML = `
          <div id="bootLoader" class="boot-loader"><div class="brand-mark"><span class="material-symbols-rounded">skillet</span></div><div class="spinner-border" role="status"></div><span>Preparando a operação...</span></div>
          <div id="loginMount"></div>
          <div id="appShell" class="app-shell d-none">
            <div id="sidebarMount"></div>
            <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>
            <div class="app-main"><div id="navbarMount"></div><main id="pageContent" class="page-content"></main><div id="footerMount"></div></div>
            <div id="mobileNavMount"></div>
          </div>
          <div id="toastHost" class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite" aria-atomic="true"></div>
          <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true" aria-labelledby="modalTitle"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><div><span class="eyebrow" id="modalEyebrow"></span><h5 class="modal-title" id="modalTitle"></h5></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body" id="modalBody"></div><div class="modal-footer" id="modalFooter"></div></div></div></div>
          <div class="firebase-status">Firebase + Google Drive</div>`;

        await Promise.all([
          mount('#loginMount', 'login.html'),
          mount('#sidebarMount', 'sidebar.html'),
          mount('#navbarMount', 'navbar.html'),
          mount('#footerMount', 'footer.html'),
          mount('#mobileNavMount', 'mobile-nav.html')
        ]);

        const pages = ['tarefas','operadores','perfil'];
        document.getElementById('pageContent').innerHTML = (await Promise.all(pages.map(name => fetchText(`${name}.html`)))).join('\n');

        const backendScripts = window.__COZINHA_PREVIEW__
          ? ['google-compat.html']
          : ['firebase-adapter.html','google-compat.html','drive-adapter.html'];
        const scripts = [
          ...backendScripts,'utils-js.html','app-js.html',
          'upload-image-v2.html','tarefas-js.html','equipe-js.html','login-js.html','simple-ux-order-fix.html'
        ];
        for (const file of scripts) await insertScriptFragment(file);
        await App.boot();
      }

      boot().catch(fail);
    })();
  </script>
</body>
</html>
