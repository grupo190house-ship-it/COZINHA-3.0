<section id="view-relatorios" class="page-view">
  <div class="page-head"><div><span class="eyebrow">Análise e fechamento</span><h1>Relatórios</h1><p>Exporte dados operacionais em PDF, Excel, CSV ou Google Sheets.</p></div></div>
  <div class="content-grid">
    <article class="card-surface p-4"><h3 class="panel-title mb-3">Gerar relatório</h3><form id="reportForm" class="row g-3">
      <div class="col-12"><label class="form-label">Relatório</label><select name="type" class="form-select"><option value="ESTOQUE">Estoque de insumos</option><option value="ESTOQUE_PRODUTOS">Produtos acabados</option><option value="COMPRAS">Compras</option><option value="PEDIDOS">Pedidos</option><option value="PRODUCOES">Produção</option><option value="PERDAS">Perdas</option><option value="INVENTARIOS">Inventários</option><option value="OPERADORES">Operadores</option><option value="MOVIMENTACOES">Consumo</option><option value="PRODUTOS">Custos e margem</option><option value="FORNECEDORES">Fornecedores</option><option value="AUDITORIA">Auditoria</option></select></div>
      <div class="col-md-6"><label class="form-label">De</label><input name="from" type="date" class="form-control"></div><div class="col-md-6"><label class="form-label">Até</label><input name="to" type="date" class="form-control"></div>
      <div class="col-12"><label class="form-label">Formato</label><select name="format" class="form-select"><option>PDF</option><option value="XLSX">Excel</option><option value="GOOGLE_SHEETS">Google Sheets</option><option>CSV</option></select></div>
      <div class="col-12"><button class="btn btn-primary w-100" type="submit"><span class="material-symbols-rounded">download</span>Gerar arquivo</button></div>
    </form></article>
    <article class="card-surface p-4"><h3 class="panel-title mb-3">Fechamento do dia</h3><div class="row g-3"><div class="col-12"><label class="form-label">Data</label><input id="closingDate" type="date" class="form-control"></div><div class="col-md-6"><label class="form-label">Responsável</label><select id="closingResponsible" class="form-select"></select></div><div class="col-md-6"><label class="form-label">Supervisor</label><select id="closingSupervisor" class="form-select"></select></div><div class="col-12"><label class="form-label">Observações</label><textarea id="closingObservations" class="form-control" rows="2"></textarea></div><div class="col-4"><button id="viewClosingButton" class="btn btn-light w-100">Conferir</button></div><div class="col-4"><button id="saveClosingButton" class="btn btn-light w-100">Fechar dia</button></div><div class="col-4"><button id="closingPdfButton" class="btn btn-primary w-100">Gerar PDF</button></div></div><div id="closingSummary" class="mt-4"></div></article>
  </div>
</section>
