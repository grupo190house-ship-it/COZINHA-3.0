<style id="cozinhaflow-clay-theme">
  /*
   * CozinhaFlow Soft Clay
   * Profundidade discreta, contraste alto e cor usada apenas para hierarquia.
   */
  :root {
    --cf-bg: #f4f5f8;
    --cf-surface: #ffffff;
    --cf-surface-soft: #f8f8fb;
    --cf-ink: #202333;
    --cf-muted: #6f7383;
    --cf-line: #e6e7ed;
    --cf-primary: #6558d3;
    --cf-primary-dark: #5145b7;
    --cf-blue: #4e8bd8;
    --cf-green: #39a47c;
    --cf-amber: #e9a23b;
    --cf-coral: #e86f66;
    --cf-purple-soft: #efedfb;
    --cf-blue-soft: #eaf3fc;
    --cf-green-soft: #e8f6f1;
    --cf-amber-soft: #fff4df;
    --cf-coral-soft: #fcedeb;
    --cf-shadow: 0 12px 30px rgba(39, 42, 61, .08), 0 2px 8px rgba(39, 42, 61, .04);
    --cf-shadow-sm: 0 5px 16px rgba(39, 42, 61, .07), 0 1px 3px rgba(39, 42, 61, .04);
    --cf-radius-lg: 22px;
    --cf-radius: 18px;
    --cf-radius-sm: 13px;
    --bg: var(--cf-bg);
    --surface: var(--cf-surface);
    --surface-2: var(--cf-surface-soft);
    --text: var(--cf-ink);
    --muted: var(--cf-muted);
    --border: var(--cf-line);
    --primary: var(--cf-primary);
    --primary-2: #7c6ee3;
    --blue: var(--cf-blue);
    --green: var(--cf-green);
    --orange: var(--cf-amber);
    --red: var(--cf-coral);
    --radius: var(--cf-radius);
  }

  * { -webkit-tap-highlight-color: transparent; }
  html { background: var(--cf-bg); }
  body,
  [data-theme="dark"] body {
    color: var(--cf-ink) !important;
    background: var(--cf-bg) !important;
  }
  body::before { content: none !important; }
  .app-shell { background: var(--cf-bg); }
  .page-content { position: relative; }

  /* Tipografia e espaçamento */
  .page-head { align-items: center !important; margin-bottom: 22px !important; }
  .page-head h1 {
    color: var(--cf-ink) !important;
    font-size: clamp(24px, 3vw, 32px) !important;
    font-weight: 800 !important;
    letter-spacing: -.04em !important;
    line-height: 1.08;
  }
  .page-head p,
  .text-secondary { color: var(--cf-muted) !important; }
  .eyebrow {
    margin-bottom: 5px;
    color: var(--cf-primary) !important;
    font-size: 10px !important;
    font-weight: 800 !important;
    letter-spacing: .12em !important;
  }

  /* Superfícies */
  .card-surface,
  .profile-section-card,
  .profile-settings,
  .shop-balance-panel,
  [data-theme="dark"] .card-surface,
  [data-theme="dark"] .profile-section-card {
    border: 1px solid var(--cf-line) !important;
    border-radius: var(--cf-radius) !important;
    background: var(--cf-surface) !important;
    color: var(--cf-ink) !important;
    box-shadow: var(--cf-shadow-sm) !important;
  }

  /* Controles */
  .btn,
  .icon-btn,
  .password-toggle {
    min-height: 44px;
    border-radius: var(--cf-radius-sm) !important;
    font-family: Inter, system-ui, sans-serif !important;
    font-weight: 700 !important;
    transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease !important;
  }
  .btn-primary,
  [data-theme="dark"] .btn-primary {
    border: 1px solid var(--cf-primary-dark) !important;
    background: linear-gradient(180deg, #7468dd, var(--cf-primary)) !important;
    color: #fff !important;
    box-shadow: 0 5px 12px rgba(81, 69, 183, .22), inset 0 1px rgba(255,255,255,.24) !important;
  }
  .btn-primary:hover,
  .btn-primary:focus-visible {
    background: linear-gradient(180deg, #6d61d7, var(--cf-primary-dark)) !important;
    transform: translateY(-1px) !important;
  }
  .btn-primary:active { transform: translateY(0) !important; box-shadow: 0 2px 6px rgba(81,69,183,.18) !important; }
  .btn-light,
  .icon-btn,
  [data-theme="dark"] .btn-light,
  [data-theme="dark"] .icon-btn {
    border: 1px solid var(--cf-line) !important;
    background: var(--cf-surface) !important;
    color: var(--cf-ink) !important;
    box-shadow: 0 2px 7px rgba(39,42,61,.05) !important;
  }
  .btn-light:hover,
  .icon-btn:hover { border-color: #d9d6f2 !important; color: var(--cf-primary) !important; }
  .btn-link { color: var(--cf-primary) !important; }
  :focus-visible { outline: 3px solid rgba(101,88,211,.22) !important; outline-offset: 2px; }

  .form-control,
  .form-select,
  [data-theme="dark"] .form-control,
  [data-theme="dark"] .form-select {
    min-height: 46px !important;
    border: 1px solid #dfe1e8 !important;
    border-radius: var(--cf-radius-sm) !important;
    background-color: #fbfbfd !important;
    color: var(--cf-ink) !important;
    box-shadow: inset 0 1px 2px rgba(39,42,61,.03) !important;
  }
  .form-control:focus,
  .form-select:focus {
    border-color: rgba(101,88,211,.58) !important;
    background-color: #fff !important;
    box-shadow: 0 0 0 3px rgba(101,88,211,.10) !important;
  }
  .form-label { color: var(--cf-ink) !important; font-size: 11px !important; }

  /* Identidade e navegação */
  .brand-mark,
  [data-theme="dark"] .brand-mark {
    border: 0 !important;
    border-radius: 14px !important;
    background: linear-gradient(145deg, #f58a75, var(--cf-coral)) !important;
    color: #fff !important;
    box-shadow: 0 6px 14px rgba(232,111,102,.22), inset 0 1px rgba(255,255,255,.28) !important;
  }
  .sidebar,
  [data-theme="dark"] .sidebar {
    border-right: 0 !important;
    background: #252638 !important;
    box-shadow: 6px 0 22px rgba(27,29,44,.10) !important;
  }
  .sidebar-brand { border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-brand-copy small,
  .nav-section { color: #9295a8 !important; }
  .side-link {
    min-height: 46px;
    border-radius: 12px !important;
    color: #c7c8d3 !important;
  }
  .side-link:hover { background: rgba(255,255,255,.06) !important; transform: none !important; }
  .side-link.active {
    background: #6558d3 !important;
    color: #fff !important;
    box-shadow: 0 5px 14px rgba(10,10,20,.18) !important;
  }
  .topbar,
  [data-theme="dark"] .topbar {
    border-bottom: 1px solid rgba(223,225,232,.86) !important;
    background: rgba(244,245,248,.90) !important;
    color: var(--cf-ink) !important;
    backdrop-filter: blur(18px) saturate(1.2);
  }
  .avatar {
    border: 1px solid #d7ebe4;
    border-radius: 12px !important;
    background: var(--cf-green-soft) !important;
    color: #27785d !important;
    box-shadow: none !important;
  }

  /* Indicadores multicoloridos */
  .metric-card,
  .task-summary-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--cf-line) !important;
    border-top: 1px solid var(--cf-line) !important;
    border-left: 1px solid var(--cf-line) !important;
    background: var(--cf-surface) !important;
    box-shadow: var(--cf-shadow-sm) !important;
  }
  .metric-card::before,
  .task-summary-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: var(--metric-color, var(--cf-primary));
  }
  .task-summary-card:nth-child(1)::before { background: var(--cf-blue); }
  .task-summary-card:nth-child(2)::before { background: var(--cf-amber); }
  .task-summary-card:nth-child(3)::before { background: var(--cf-green); }
  .task-summary-card:nth-child(4)::before { background: var(--cf-coral); }
  .metric-icon,
  .task-summary-icon {
    border: 0 !important;
    border-radius: 13px !important;
    box-shadow: none !important;
  }
  .task-summary-icon.todo { background: var(--cf-blue-soft) !important; color: var(--cf-blue) !important; }
  .task-summary-icon.doing { background: var(--cf-amber-soft) !important; color: #b87314 !important; }
  .task-summary-icon.done { background: var(--cf-green-soft) !important; color: var(--cf-green) !important; }
  .task-summary-icon.overdue { background: var(--cf-coral-soft) !important; color: var(--cf-coral) !important; }

  /* Tarefas */
  .task-board,
  [data-theme="dark"] .task-board {
    border: 1px solid var(--cf-line) !important;
    border-radius: var(--cf-radius-lg) !important;
    background: #eceef3 !important;
    box-shadow: inset 0 1px 2px rgba(39,42,61,.04) !important;
  }
  .task-column,
  [data-theme="dark"] .task-column {
    border: 1px solid var(--cf-line) !important;
    border-radius: 17px !important;
    background: #f8f8fa !important;
    box-shadow: none !important;
  }
  .task-column-head { border-bottom: 1px solid var(--cf-line) !important; }
  .task-column.todo .task-column-head { background: var(--cf-blue-soft) !important; }
  .task-column.doing .task-column-head { background: var(--cf-amber-soft) !important; }
  .task-column.review .task-column-head { background: var(--cf-purple-soft) !important; }
  .task-column.done .task-column-head { background: var(--cf-green-soft) !important; }
  .task-card,
  [data-theme="dark"] .task-card {
    border: 1px solid #e2e3e9 !important;
    border-radius: 15px !important;
    background: #fff !important;
    color: var(--cf-ink) !important;
    box-shadow: 0 3px 10px rgba(39,42,61,.06) !important;
  }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(39,42,61,.09) !important; }
  .task-priority,
  .badge-soft,
  .production-status { border: 0 !important; border-radius: 999px !important; box-shadow: none !important; }
  .task-toolbar { padding: 12px !important; gap: 10px !important; }
  .task-mobile-tabs {
    border: 1px solid var(--cf-line) !important;
    border-radius: 15px !important;
    background: #ebecef !important;
    box-shadow: none !important;
  }
  .task-mobile-tab { min-height: 42px !important; border-radius: 11px !important; color: var(--cf-muted) !important; }
  .task-mobile-tab.active {
    background: #fff !important;
    color: var(--cf-primary) !important;
    box-shadow: 0 2px 7px rgba(39,42,61,.09) !important;
  }
  .task-mobile-tab.todo.active { color: var(--cf-blue) !important; }
  .task-mobile-tab.doing.active { color: #b87314 !important; }
  .task-mobile-tab.review.active { color: var(--cf-primary) !important; }
  .task-mobile-tab.done.active { color: var(--cf-green) !important; }
  .task-mobile-tab.active strong { background: currentColor !important; color: #fff !important; }

  /* Listas, tabelas, modais */
  .operation-row,
  .alert-item,
  .team-mobile-card,
  .reward-card,
  .profile-rule-card,
  [data-theme="dark"] .operation-row,
  [data-theme="dark"] .alert-item {
    border: 1px solid var(--cf-line) !important;
    border-radius: 15px !important;
    background: #fff !important;
    color: var(--cf-ink) !important;
    box-shadow: 0 2px 8px rgba(39,42,61,.05) !important;
  }
  .table-responsive {
    border: 1px solid var(--cf-line) !important;
    border-radius: var(--cf-radius) !important;
    background: #fff !important;
    box-shadow: var(--cf-shadow-sm) !important;
  }
  .table th { background: #f1f1f5 !important; color: var(--cf-ink) !important; }
  .table td { border-color: #ececf1 !important; }
  .modal-content,
  [data-theme="dark"] .modal-content {
    overflow: hidden;
    border: 1px solid var(--cf-line) !important;
    border-radius: 22px !important;
    background: #fff !important;
    color: var(--cf-ink) !important;
    box-shadow: 0 24px 70px rgba(32,35,51,.20) !important;
  }
  .modal-header,
  .modal-footer { border-color: var(--cf-line) !important; background: #fafafd !important; }
  #toastHost .toast,
  [data-theme="dark"] #toastHost .toast {
    border: 1px solid var(--cf-line) !important;
    border-left: 4px solid var(--cf-green) !important;
    border-radius: 14px !important;
    background: #fff !important;
    color: var(--cf-ink) !important;
    box-shadow: var(--cf-shadow) !important;
  }

  /* Login: clay concentrado no ponto de entrada */
  .login-screen,
  [data-theme="dark"] .login-screen {
    background:
      radial-gradient(circle at 12% 12%, rgba(78,139,216,.12), transparent 28rem),
      radial-gradient(circle at 90% 88%, rgba(232,111,102,.10), transparent 26rem),
      var(--cf-bg) !important;
  }
  .login-form-wrap,
  [data-theme="dark"] .login-form-wrap {
    border: 1px solid rgba(255,255,255,.9) !important;
    border-top: 1px solid rgba(255,255,255,.9) !important;
    border-radius: 24px !important;
    background: rgba(255,255,255,.96) !important;
    color: var(--cf-ink) !important;
    box-shadow: 0 20px 50px rgba(39,42,61,.12), -8px -8px 20px rgba(255,255,255,.72) !important;
  }
  .login-form-wrap h1 { color: var(--cf-ink) !important; }
  .login-art-card {
    border: 1px solid rgba(255,255,255,.12) !important;
    border-radius: 26px !important;
    background: #333047 !important;
    box-shadow: 0 22px 50px rgba(32,35,51,.22) !important;
  }
  .login-bg-mesh { opacity: .35; }
  .login-feature:nth-of-type(1) .material-symbols-rounded { color: #85b8f0 !important; }
  .login-feature:nth-of-type(2) .material-symbols-rounded { color: #f2bd68 !important; }
  .login-feature:nth-of-type(3) .material-symbols-rounded { color: #78c7aa !important; }

  /* Mobile é o layout principal */
  @media (max-width: 900px) {
    body,
    [data-theme="dark"] body { background: var(--cf-bg) !important; }
    .page-content { padding: 15px 12px calc(82px + env(safe-area-inset-bottom)) !important; }
    .topbar {
      height: 58px !important;
      padding: 0 12px !important;
      background: rgba(244,245,248,.94) !important;
    }
    .topbar-title strong { font-size: 14px; }
    .topbar .icon-btn { width: 40px; height: 40px; min-height: 40px; }
    .page-head { margin: 2px 0 14px !important; }
    .page-head h1 { font-size: 23px !important; }
    .task-summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 9px !important;
      margin-bottom: 13px !important;
    }
    .task-summary-card {
      min-height: 82px !important;
      padding: 14px 12px !important;
      border-radius: 16px !important;
      text-align: left !important;
    }
    .task-summary-card small { min-height: 0 !important; font-size: 9px !important; }
    .task-summary-card strong { margin-top: 2px !important; font-size: 22px !important; }
    .task-toolbar { padding: 10px !important; border-radius: 16px !important; }
    .task-mobile-tabs {
      gap: 3px;
      padding: 4px !important;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .task-mobile-tab { flex: 0 0 auto; min-width: 91px; padding-inline: 9px !important; }
    .task-board,
    .task-board > .task-column.mobile-active {
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
    }
    .task-card { padding: 14px !important; border-radius: 16px !important; }
    .task-column-list { gap: 10px !important; }
    .task-archive { border-radius: 16px !important; }
    .mobile-bottom-nav,
    [data-theme="dark"] .mobile-bottom-nav {
      right: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      min-height: 66px !important;
      padding: 5px 8px max(5px, env(safe-area-inset-bottom)) !important;
      border: 0 !important;
      border-top: 1px solid var(--cf-line) !important;
      border-radius: 0 !important;
      background: rgba(255,255,255,.97) !important;
      box-shadow: 0 -6px 18px rgba(39,42,61,.06) !important;
      backdrop-filter: blur(16px);
    }
    .mobile-nav-link {
      min-height: 52px !important;
      border-radius: 12px !important;
      color: var(--cf-muted) !important;
    }
    .mobile-nav-link.active {
      background: var(--cf-purple-soft) !important;
      color: var(--cf-primary) !important;
      box-shadow: none !important;
    }
    #newTaskButton {
      width: 46px !important;
      min-width: 46px !important;
      min-height: 46px !important;
      border-radius: 14px !important;
    }
    .login-panel { padding: max(22px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom)) !important; }
    .login-form-wrap { padding: 24px 20px !important; }
    .login-brand-row { border-bottom-color: var(--cf-line) !important; }
    .modal-dialog { margin: 8px !important; }
    .modal-content { max-height: calc(100dvh - 16px); border-radius: 20px !important; }
    #toastHost { bottom: calc(76px + env(safe-area-inset-bottom)) !important; }
    .firebase-status { display: none !important; }
  }

  @media (max-width: 380px) {
    .page-content { padding-inline: 10px !important; }
    .task-summary-grid { gap: 7px !important; }
    .task-summary-card { padding-inline: 10px !important; }
  }

  @media (min-width: 901px) {
    .page-content { padding: 30px clamp(24px, 3vw, 44px) !important; }
    .task-board { padding: 14px !important; gap: 14px !important; }
    .topbar { padding-inline: clamp(20px, 3vw, 40px) !important; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* ========================================================================
     Composição mobile v3 — ajustes específicos por tela
     ======================================================================== */
  @media (max-width: 900px) {
    /* Cabeçalho único e compacto, respeitando a área segura do iPhone. */
    .topbar,
    [data-theme="dark"] .topbar {
      box-sizing: border-box !important;
      height: calc(52px + env(safe-area-inset-top, 0px)) !important;
      min-height: calc(52px + env(safe-area-inset-top, 0px)) !important;
      padding: env(safe-area-inset-top, 0px) 14px 0 !important;
      gap: 8px !important;
      align-items: center !important;
      background: rgba(248,248,251,.96) !important;
      box-shadow: none !important;
    }
    .topbar-title {
      display: flex !important;
      align-items: center !important;
      gap: 7px !important;
    }
    .topbar-title strong {
      color: var(--cf-ink) !important;
      font-size: 16px !important;
      font-weight: 750 !important;
      letter-spacing: -.025em;
    }
    .topbar-title .material-symbols-rounded {
      color: var(--cf-primary) !important;
      font-size: 21px !important;
    }
    .topbar .user-menu { margin-left: auto !important; }
    .topbar .user-menu .dropdown > .icon-btn {
      width: 40px !important;
      height: 40px !important;
      min-height: 40px !important;
      border-radius: 12px !important;
      background: #fff !important;
      box-shadow: 0 3px 10px rgba(39,42,61,.06) !important;
    }
    .page-content {
      padding: 14px 12px calc(78px + env(safe-area-inset-bottom, 0px)) !important;
    }

    /* O título do módulo já aparece no cabeçalho: não o repete no conteúdo. */
    #view-perfil > .page-head { display: none !important; }
    #view-operadores > .page-head,
    #view-tarefas > .page-head {
      display: block !important;
      min-height: 0 !important;
      margin: 0 0 12px !important;
      padding: 0 !important;
    }
    #view-operadores > .page-head > div:first-child,
    #view-tarefas > .page-head > div:first-child { display: none !important; }
    #view-operadores > .page-head .page-actions,
    #view-tarefas > .page-head .page-actions {
      display: block !important;
      width: 100% !important;
      margin: 0 !important;
    }
    #view-tarefas > .page-head .page-actions:has(#newTaskButton.d-none) { display: none !important; }
    #newTaskButton,
    #newUserButton {
      width: 100% !important;
      min-width: 0 !important;
      min-height: 48px !important;
      padding: 0 16px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      border-radius: 14px !important;
      font-size: 14px !important;
      line-height: 1 !important;
      white-space: nowrap !important;
    }
    #newTaskButton.d-none,
    #newUserButton.d-none { display: none !important; }
    #newTaskButton .material-symbols-rounded,
    #newUserButton .material-symbols-rounded { font-size: 20px !important; }

    /* Tarefas */
    #view-tarefas .task-summary-grid,
    #view-operadores .team-summary-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px !important;
      margin: 0 0 12px !important;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }
    #view-tarefas .task-summary-card,
    #view-operadores .task-summary-card {
      min-height: 70px !important;
      padding: 12px 13px !important;
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 10px !important;
      border-radius: 15px !important;
      text-align: left !important;
    }
    #view-tarefas .task-summary-card::before,
    #view-operadores .task-summary-card::before {
      inset: 0 auto 0 0 !important;
      width: 4px !important;
      height: auto !important;
    }
    #view-tarefas .task-summary-icon,
    #view-operadores .task-summary-icon { display: none !important; }
    #view-tarefas .task-summary-card > div,
    #view-operadores .task-summary-card > div {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #view-tarefas .task-summary-card small,
    #view-operadores .task-summary-card small {
      min-height: 0 !important;
      color: var(--cf-muted) !important;
      font-size: 10px !important;
