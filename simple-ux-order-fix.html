<script>
(() => {
  'use strict';

  function installInterfaceRecovery() {
    if (document.getElementById('interfaceRecoveryV15')) return;

    const style = document.createElement('style');
    style.id = 'interfaceRecoveryV15';
    style.textContent = `
      /* A fonte monoespaçada da referência foi removida da interface. */
      body,
      body *:not(.material-symbols-rounded) {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      }

      h1, h2, h3, h4, h5, h6,
      .modal-title,
      .panel-title,
      .metric-value,
      .production-card-code,
      .stock-balance,
      .eyebrow,
      .nav-section,
      .metric-label,
      .badge-soft,
      .form-label,
      .table th,
      .production-status,
      .task-priority,
      .md-kicker {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        letter-spacing: normal !important;
      }

      h1, h2, h3, .modal-title, .panel-title {
        letter-spacing: -.025em !important;
      }

      /* O estado oculto precisa vencer qualquer regra visual do tema. */
      #loginScreen.d-none,
      #loginScreen[hidden],
      #appShell.d-none,
      #appShell[hidden],
      #bootLoader.d-none {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      #loginScreen.d-none {
        position: fixed !important;
        width: 0 !important;
        height: 0 !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }

      @media (max-width: 900px) {
        html {
          -webkit-text-size-adjust: 100% !important;
          text-size-adjust: 100% !important;
        }

        input,
        select,
        textarea,
        .form-control,
        .form-select,
        .global-search input,
        .login-form-wrap .form-control,
        .task-toolbar .form-control,
        .task-toolbar .form-select {
          font-size: 16px !important;
          line-height: 1.25 !important;
        }

        button,
        a,
        input,
        select,
        textarea,
        .btn,
        .icon-btn,
        .side-link,
        .mobile-nav-link {
          touch-action: manipulation !important;
        }

        #loginScreen {
          width: 100% !important;
          max-width: 100% !important;
          min-height: 100dvh !important;
          overflow-x: hidden !important;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function enforceAuthVisibility() {
    const login = document.getElementById('loginScreen');
    const shell = document.getElementById('appShell');
    if (!login || !shell) return;

    const appIsVisible = !shell.classList.contains('d-none');
    if (appIsVisible) {
      if (!login.classList.contains('d-none')) login.classList.add('d-none');
      login.hidden = true;
      login.setAttribute('aria-hidden', 'true');
      login.style.setProperty('display', 'none', 'important');

      shell.hidden = false;
      shell.removeAttribute('aria-hidden');
      shell.style.removeProperty('display');
      return;
    }

    const loginShouldBeVisible = !login.classList.contains('d-none');
    if (loginShouldBeVisible) {
      login.hidden = false;
      login.removeAttribute('aria-hidden');
      login.style.removeProperty('display');
    }
  }

  function observeAuthVisibility() {
    const login = document.getElementById('loginScreen');
    const shell = document.getElementById('appShell');
    if (!login || !shell || document.body.dataset.authVisibilityObserver === '1') return;

    document.body.dataset.authVisibilityObserver = '1';
    const observer = new MutationObserver(() => requestAnimationFrame(enforceAuthVisibility));
    observer.observe(login, { attributes: true, attributeFilter: ['class', 'hidden'] });
    observer.observe(shell, { attributes: true, attributeFilter: ['class', 'hidden'] });
    enforceAuthVisibility();
  }

  function arrangeFinishForm() {
    const form = document.getElementById('productionFinishForm');
    if (!form || form.dataset.simpleUx !== '1' || form.dataset.simpleOrder === '1') return;

    const intro = form.querySelector('.simple-form-intro')?.closest('.col-12');
    const summary = form.querySelector('.production-result-summary')?.closest('.col-12');
    const unitRow = form.querySelector('.production-unit-row')?.closest('.col-12');
    const toggle = document.getElementById('simpleProductionLossToggle')?.closest('.col-12');
    const lossFields = document.getElementById('simpleProductionLossFields');
    const yieldBox = document.getElementById('finishYieldV2')?.closest('.col-12');
    const costBox = form.querySelector('.production-cost-preview')?.closest('.col-12');
    const advanced = form.querySelector('.simple-more');
    const warning = [...form.querySelectorAll('.alert')].find(item => item.textContent.includes('Ao finalizar'))?.closest('.col-12');

    if (intro) form.prepend(intro);
    [summary, unitRow, toggle, lossFields, yieldBox, costBox, advanced, warning]
      .filter(Boolean)
      .forEach(element => form.appendChild(element));

    form.dataset.simpleOrder = '1';
  }

  installInterfaceRecovery();
  observeAuthVisibility();

  const bodyObserver = new MutationObserver(() => {
    installInterfaceRecovery();
    observeAuthVisibility();
    enforceAuthVisibility();
  });
  bodyObserver.observe(document.body, { childList: true, subtree: true });

  window.addEventListener('pageshow', () => setTimeout(enforceAuthVisibility, 0));
  window.addEventListener('resize', () => setTimeout(enforceAuthVisibility, 0));

  const host = document.getElementById('modalBody');
  if (host) new MutationObserver(() => requestAnimationFrame(arrangeFinishForm)).observe(host, { childList: true, subtree: true });
  document.getElementById('appModal')?.addEventListener('shown.bs.modal', () => setTimeout(arrangeFinishForm, 0));
})();
</script>
