<style id="motherduck-kitchen-theme">
  :root {
    --md-cream: #f5f0e8;
    --md-paper: #fffdf8;
    --md-paper-2: #f0e9df;
    --md-ink: #292825;
    --md-muted: #6f6a62;
    --md-line: #292825;
    --md-blue: #63b7f4;
    --md-blue-dark: #1686d9;
    --md-yellow: #ffe44f;
    --md-orange: #ff8a3d;
    --md-green: #73c69c;
    --md-red: #f2685b;
    --md-lilac: #bca7ef;
    --md-shadow: 4px 4px 0 #292825;
    --md-shadow-sm: 2px 2px 0 #292825;
    --md-radius: 8px;
    --bg: var(--md-cream);
    --surface: var(--md-paper);
    --surface-2: var(--md-paper-2);
    --surface-3: #e6ddd1;
    --text: var(--md-ink);
    --muted: var(--md-muted);
    --border: rgba(41, 40, 37, .24);
    --primary: var(--md-blue-dark);
    --primary-2: var(--md-blue);
    --blue: var(--md-blue-dark);
    --green: #2e9c68;
    --orange: #d96424;
    --red: #c84237;
    --radius: var(--md-radius);
    --shadow-sm: none;
    --shadow-md: var(--md-shadow);
    --sidebar: 248px;
    --navbar: 62px;
  }

  html { color-scheme: light !important; background: var(--md-cream); }
  body,
  [data-theme="dark"] body {
    background:
      radial-gradient(circle at 1px 1px, rgba(41,40,37,.075) 1px, transparent 1.2px) 0 0 / 22px 22px,
      var(--md-cream) !important;
    color: var(--md-ink) !important;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    z-index: 1090;
    height: 5px;
    pointer-events: none;
    background: linear-gradient(90deg, var(--md-yellow) 0 32%, var(--md-orange) 32% 48%, var(--md-blue) 48% 78%, var(--md-green) 78%);
  }

  h1, h2, h3, h4, h5, h6,
  .modal-title,
  .panel-title,
  .metric-value,
  .production-card-code,
  .stock-balance {
    color: var(--md-ink) !important;
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace !important;
    letter-spacing: -.035em !important;
  }

  .eyebrow,
  .nav-section,
  .metric-label,
  .badge-soft,
  .form-label,
  .table th,
  .production-status,
  .task-priority,
  .md-kicker {
    font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace !important;
    letter-spacing: .055em !important;
    text-transform: uppercase;
  }

  ::selection { background: var(--md-yellow); color: var(--md-ink); }
  * { scrollbar-color: var(--md-ink) transparent; }
  *::-webkit-scrollbar-thumb { background: var(--md-ink); }

  .boot-loader,
  #initialLoader {
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
  }
  .boot-loader .brand-mark,
  #initialLoader .brand-mark {
    border: 2px solid var(--md-ink);
    background: var(--md-blue) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .boot-loader .spinner-border,
  #initialLoader .spinner-border { color: var(--md-ink) !important; }

  /* Barra superior */
  .topbar,
  [data-theme="dark"] .topbar {
    height: var(--navbar) !important;
    padding: 0 18px !important;
    gap: 10px !important;
    border-bottom: 2px solid var(--md-ink) !important;
    background: rgba(245,240,232,.96) !important;
    color: var(--md-ink) !important;
    box-shadow: none !important;
    backdrop-filter: blur(10px) !important;
  }
  .topbar::after {
    content: "OPERAÇÃO EM TEMPO REAL";
    flex: 0 0 auto;
    padding: 5px 8px;
    border: 1.5px solid var(--md-ink);
    border-radius: 999px;
    background: var(--md-yellow);
    color: var(--md-ink);
    font: 700 9px "IBM Plex Mono", monospace;
    letter-spacing: .05em;
  }
  .topbar .icon-btn,
  .topbar .theme-toggle,
  [data-theme="dark"] .topbar .icon-btn {
    width: 38px !important;
    height: 38px !important;
    min-height: 38px !important;
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .topbar .icon-btn:hover { transform: translate(1px,1px) !important; box-shadow: 1px 1px 0 var(--md-ink) !important; }
  #themeToggle { display: none !important; }
  .global-search { width: min(590px, 52vw) !important; }
  .global-search input,
  [data-theme="dark"] .global-search input {
    height: 40px !important;
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: none !important;
  }
  .global-search input::placeholder { color: #847e74 !important; }
  .global-search > .material-symbols-rounded { color: var(--md-ink) !important; }
  .search-results,
  .dropdown-menu {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow) !important;
  }
  .topbar .avatar {
    width: 36px !important;
    height: 36px !important;
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 50% !important;
    background: var(--md-orange) !important;
    color: var(--md-ink) !important;
  }
  .topbar .user-copy strong,
  .topbar .user-copy small { color: var(--md-ink) !important; }

  /* Menu lateral */
  .sidebar,
  [data-theme="dark"] .sidebar {
    width: var(--sidebar) !important;
    padding: 12px 10px 24px !important;
    border-right: 2px solid var(--md-ink) !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: none !important;
  }
  .sidebar-brand {
    min-height: 62px !important;
    margin-bottom: 7px !important;
    padding: 8px 8px 14px !important;
    border-bottom: 1.5px dashed var(--md-ink) !important;
  }
  .sidebar-brand .brand-mark,
  .login-brand-row .brand-mark {
    width: 40px !important;
    height: 40px !important;
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 50% 50% 44% 56% !important;
    background: var(--md-orange) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
    transform: rotate(-3deg);
  }
  .sidebar-brand-copy strong { color: var(--md-ink) !important; font-family: "IBM Plex Mono", monospace; }
  .sidebar-brand-copy small { color: var(--md-muted) !important; }
  .nav-section {
    margin: 11px 4px 5px !important;
    padding: 5px 7px !important;
    border-bottom: 1px solid rgba(41,40,37,.18);
    color: var(--md-muted) !important;
    font-size: 9px !important;
  }
  .side-nav { gap: 4px !important; }
  .side-link,
  [data-theme="dark"] .side-link {
    min-height: 39px !important;
    padding: 8px 10px !important;
    gap: 10px !important;
    border: 1.5px solid transparent !important;
    border-radius: 6px !important;
    background: transparent !important;
    color: var(--md-ink) !important;
    font-weight: 650 !important;
  }
  .side-link .material-symbols-rounded { color: var(--md-ink) !important; }
  .side-link:hover {
    border-color: var(--md-ink) !important;
    background: var(--md-blue) !important;
    transform: translate(-1px,-1px) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .side-link.active {
    border-color: var(--md-ink) !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .side-link.active::after {
    content: "→";
    margin-left: auto;
    font: 800 16px "IBM Plex Mono", monospace;
  }
  .side-link.danger { color: #b42f26 !important; }

  /* Conteúdo e cabeçalhos */
  .app-main,
  .page-content { background: transparent !important; }
  .page-content { padding: 24px 26px 38px !important; }
  .page-view { max-width: 1660px !important; }
  .page-head {
    margin-bottom: 18px !important;
    padding: 7px 2px 12px !important;
    border-bottom: 1.5px solid var(--md-ink);
  }
  .page-head h1 { font-size: clamp(24px,2.5vw,34px) !important; }
  .page-head p { color: var(--md-muted) !important; }
  .eyebrow { color: var(--md-blue-dark) !important; font-size: 9px !important; }

  /* Hero original */
  .md-kitchen-hero {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0,1.25fr) minmax(300px,.75fr);
    min-height: 278px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 2px solid var(--md-ink);
    border-radius: 10px;
    background: var(--md-paper);
    box-shadow: var(--md-shadow);
  }
  .md-kitchen-hero::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 57%;
    width: 2px;
    background: var(--md-ink);
  }
  .md-kitchen-copy {
    position: relative;
    z-index: 1;
    padding: clamp(24px,4vw,48px);
  }
  .md-kicker {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 15px;
    padding: 6px 9px;
    border: 1.5px solid var(--md-ink);
    border-radius: 999px;
    background: var(--md-yellow);
    color: var(--md-ink);
    font-size: 9px;
    font-weight: 800;
  }
  .md-kicker::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--md-green); border: 1px solid var(--md-ink); }
  .md-kitchen-copy h1 {
    max-width: 780px;
    margin: 0;
    font-size: clamp(30px,5vw,58px) !important;
    line-height: 1.02;
  }
  .md-kitchen-copy p { max-width: 650px; margin: 17px 0 0; color: var(--md-muted); font-size: 14px; line-height: 1.55; }
  .md-hero-refresh { margin-top: 22px; }
  .md-kitchen-art {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    padding: 22px;
    background: var(--md-blue);
  }
  .md-kitchen-art::before,
  .md-kitchen-art::after {
    content: "";
    position: absolute;
    border: 2px solid var(--md-ink);
    border-radius: 50%;
  }
  .md-kitchen-art::before { width: 70px; height: 70px; top: 18px; right: 22px; background: var(--md-yellow); }
  .md-kitchen-art::after { width: 38px; height: 38px; bottom: 21px; left: 20px; background: var(--md-orange); }
  .md-kitchen-art svg { position: relative; z-index: 1; width: min(360px,100%); filter: drop-shadow(5px 6px 0 rgba(41,40,37,.22)); }

  /* Cartões e ações */
  .card-surface,
  .metric-card,
  .quick-action-card,
  .stock-item-card,
  .purchase-card,
  .task-summary-card,
  .task-card,
  .production-card,
  .task-column,
  .inventory-quick-card,
  .toolbar,
  .task-toolbar,
  .task-archive,
  [data-theme="dark"] .card-surface,
  [data-theme="dark"] .metric-card,
  [data-theme="dark"] .production-card {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: var(--md-radius) !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .card-surface:hover,
  .metric-card:hover,
  .quick-action-card:hover,
  .stock-item-card:hover,
  .production-card:hover { transform: translate(-1px,-1px) !important; box-shadow: var(--md-shadow) !important; }

  .quick-actions-section { margin-bottom: 20px !important; }
  .quick-actions-head h2 { font-size: 17px !important; }
  .quick-actions-grid { gap: 11px !important; }
  .quick-action-card {
    min-height: 92px !important;
    padding: 14px !important;
    overflow: visible !important;
  }
  .quick-action-card::after { display: none !important; }
  .quick-action-card:nth-child(1) { background: #d9efff !important; }
  .quick-action-card:nth-child(2) { background: #ffe0db !important; }
  .quick-action-card:nth-child(3) { background: #dff4e9 !important; }
  .quick-action-card:nth-child(4) { background: #eee6ff !important; }
  .quick-action-card .quick-action-icon {
    border: 1.5px solid var(--md-ink);
    border-radius: 50% 50% 45% 55% !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm);
  }
  .quick-action-card strong { font-family: "IBM Plex Mono", monospace; }

  .metric-grid { gap: 12px !important; }
  .metric-card {
    min-height: 130px !important;
    padding: 15px !important;
    border-top-width: 1.5px !important;
    border-left: 8px solid var(--metric-color, var(--md-blue)) !important;
    overflow: hidden !important;
  }
  .metric-card::after {
    display: block !important;
    width: 76px !important;
    height: 76px !important;
    right: -30px !important;
    bottom: -28px !important;
    border: 1.5px solid var(--md-ink);
    background: var(--metric-color, var(--md-blue)) !important;
    opacity: .22 !important;
  }
  .metric-icon {
    border: 1.5px solid var(--md-ink);
    border-radius: 50% !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
  }
  .metric-value { font-size: 27px !important; }
  .metric-detail { color: var(--md-muted) !important; font-size: 10px; }

  .operation-row,
  .alert-item {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper-2) !important;
  }
  .operation-icon {
    border: 1.5px solid var(--md-ink);
    border-radius: 50% !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
  }

  /* Botões */
  .btn,
  .icon-btn {
    border-radius: 5px !important;
    font-family: "IBM Plex Mono", monospace !important;
    font-weight: 750 !important;
    letter-spacing: -.02em;
  }
  .btn-primary,
  [data-theme="dark"] .btn-primary {
    border: 1.5px solid var(--md-ink) !important;
    background: var(--md-blue) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
  }
  .btn-primary:hover,
  .btn-primary:focus {
    border-color: var(--md-ink) !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
    transform: translate(1px,1px) !important;
    box-shadow: 1px 1px 0 var(--md-ink) !important;
  }
  .btn-light,
  [data-theme="dark"] .btn-light {
    border: 1.5px solid var(--md-ink) !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: none !important;
  }
  .btn-light:hover { background: var(--md-yellow) !important; }
  .btn-link { color: #096faf !important; }

  /* Formulários e modais */
  .form-control,
  .form-select,
  [data-theme="dark"] .form-control,
  [data-theme="dark"] .form-select {
    min-height: 43px !important;
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 5px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: none !important;
  }
  .form-control:focus,
  .form-select:focus {
    border-color: var(--md-ink) !important;
    background: #fff !important;
    color: var(--md-ink) !important;
    box-shadow: 3px 3px 0 var(--md-blue) !important;
  }
  .form-label { color: var(--md-ink) !important; font-size: 10px !important; }
  .modal-content,
  [data-theme="dark"] .modal-content {
    border: 2px solid var(--md-ink) !important;
    border-radius: 9px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: 8px 8px 0 var(--md-ink) !important;
  }
  .modal-header,
  .modal-footer { border-color: var(--md-ink) !important; background: var(--md-paper-2) !important; }
  .modal-header { border-bottom-style: dashed !important; }
  .modal-footer { border-top-style: dashed !important; }
  .btn-close { filter: none !important; }
  .simple-form-intro,
  .stock-entry-intro {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
  }
  .simple-form-intro > .material-symbols-rounded,
  .stock-entry-intro > .material-symbols-rounded {
    border: 1.5px solid var(--md-ink);
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
  }
  .simple-more,
  .stock-entry-more,
  .production-compact-details {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
  }
  .stock-entry-total,
  .loss-cost-preview,
  .production-result-summary,
  .production-cost-preview > span {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper-2) !important;
  }

  /* Tabelas */
  .table-responsive {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
  }
  .table { color: var(--md-ink) !important; }
  .table th {
    border-color: var(--md-ink) !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
  }
  .table td { border-color: rgba(41,40,37,.22) !important; }
  .table tbody tr:hover td { background: #e1f2ff !important; }
  .pagination-row { border-top: 1.5px solid var(--md-ink); background: var(--md-paper-2) !important; }

  /* Tarefas */
  .task-board {
    min-height: 480px !important;
    border: 2px solid var(--md-ink) !important;
    border-radius: 10px !important;
    background: var(--md-blue) !important;
    box-shadow: var(--md-shadow) !important;
  }
  .task-column { background: var(--md-paper-2) !important; box-shadow: var(--md-shadow-sm) !important; }
  .task-column-head { border-bottom: 1.5px dashed var(--md-ink) !important; }
  .task-column.todo .task-column-head { background: #dff0ff; }
  .task-column.doing .task-column-head { background: #ffe9bb; }
  .task-column.done .task-column-head { background: #dff4e9; }
  .task-column-count { border: 1px solid var(--md-ink); border-radius: 50% !important; background: var(--md-paper) !important; color: var(--md-ink) !important; }
  .task-card { border-radius: 5px !important; }
  .task-priority { border: 1px solid var(--md-ink); border-radius: 999px !important; }

  /* Estoque, produção e compras */
  .stock-card-grid,
  .purchase-list { background: transparent !important; }
  .stock-item-card.low { border-left: 8px solid var(--md-red) !important; }
  .stock-item-head h3,
  .purchase-card h3 { font-family: "IBM Plex Mono", monospace !important; }
  .stock-card-actions .btn { min-height: 37px; }
  .production-card.is-running { border-left: 8px solid var(--md-orange) !important; }
  .production-card.is-finished { border-left: 8px solid var(--md-green) !important; }
  .production-card.is-cancelled { border-left: 8px solid var(--md-red) !important; }
  .production-status { border: 1px solid var(--md-ink); border-radius: 999px !important; }
  .production-compact-summary {
    border: 1.5px dashed var(--md-ink) !important;
    border-radius: 6px !important;
    background: var(--md-paper-2) !important;
  }

  /* Avisos */
  #toastHost .toast,
  [data-theme="dark"] #toastHost .toast {
    opacity: 1 !important;
    border: 1.5px solid var(--md-ink) !important;
    border-left: 8px solid var(--md-green) !important;
    border-radius: 6px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow) !important;
  }
  .firebase-status {
    border: 1.5px solid var(--md-ink) !important;
    border-radius: 999px !important;
    background: var(--md-yellow) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow-sm) !important;
    font-family: "IBM Plex Mono", monospace !important;
  }

  /* Login */
  .login-screen,
  [data-theme="dark"] .login-screen {
    grid-template-columns: minmax(420px,.9fr) minmax(520px,1.1fr) !important;
    min-height: 100dvh;
    background: var(--md-cream) !important;
  }
  .login-panel,
  [data-theme="dark"] .login-panel {
    min-height: 100dvh !important;
    padding: 48px clamp(24px,6vw,86px) !important;
    align-items: center !important;
    background: transparent !important;
  }
  .login-form-wrap,
  [data-theme="dark"] .login-form-wrap {
    width: min(510px,100%) !important;
    padding: 28px !important;
    border: 2px solid var(--md-ink) !important;
    border-radius: 10px !important;
    background: var(--md-paper) !important;
    color: var(--md-ink) !important;
    box-shadow: var(--md-shadow) !important;
  }
  .login-brand-row { border-bottom: 1.5px dashed var(--md-ink) !important; }
  .login-form-wrap h1 { font-size: clamp(27px,4vw,42px) !important; }
  .login-art {
    position: relative;
    display: grid !important;
    min-height: 100dvh;
    padding: 48px;
    overflow: hidden;
    border-left: 2px solid var(--md-ink);
    background: var(--md-blue) !important;
  }
  .login-art::before {
    content: "";
    position: absolute;
